  .fp-fore{display:grid;grid-template-columns:repeat(var(--fc,5),1fr);gap:8px;}
  .fp-fc{background:var(--tile);border:1px solid var(--line);border-radius:var(--r-m);
    padding:10px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:5px;}
  .fp-fc .d{font-size:12px;color:var(--muted);}
  .fp-fc .ico{width:26px;height:26px;display:grid;place-items:center;color:var(--ink);}
  .fp-fc .ico svg{width:100%;height:100%;}
  .fp-fc .ico.sun{color:var(--glow);}
  .fp-fc .ico.rain,.fp-fc .ico.drizzle,.fp-fc .ico.snow,.fp-fc .ico.storm{color:var(--cool,#7fb2e6);}
  .fp-fc .tt{font-size:13px;font-variant-numeric:tabular-nums;}
  .fp-fc .tt .mx{font-weight:600;} .fp-fc .tt .mn{color:var(--muted);}
  .fp-fc .pop{font-size:11px;color:var(--cool,#7fb2e6);}
  .fp-cal{display:flex;flex-direction:column;gap:6px;}
  .fp-day{font-size:13px;font-weight:600;color:var(--muted);margin-top:8px;}
  .fp-ev{display:grid;grid-template-columns:70px 1fr;align-items:baseline;gap:12px;
    background:var(--tile);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 12px;}
  .fp-ev .tm{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);}
  .fp-ev .tm.all{color:var(--muted);font-weight:500;font-size:12px;}
  .fp-ev .ttl{font-size:15px;overflow:hidden;text-overflow:ellipsis;}
  .fp-empty{color:var(--muted);font-size:14px;padding:6px 0;}
  /* Wetter-Detailkacheln (Luftfeuchte, Wind, Sonne, UV, ...) */
  .fp-det{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .fp-det>div{background:var(--tile);border:1px solid var(--line);border-radius:var(--r-s);
    padding:8px 11px;display:flex;flex-direction:column;gap:2px;}
  .fp-det>div span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .fp-det>div b{font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink);}
  /* Monatsraster im Kalender-Pane — als eigene Karte */
  .fp-mon{display:flex;flex-direction:column;background:var(--tile);
    border:1px solid var(--line);border-radius:var(--r-m);padding:14px 14px 16px;
    box-shadow:0 1px 4px rgba(0,0,0,.18);}
  .fp-mon-h{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding-bottom:11px;margin-bottom:9px;border-bottom:1px solid var(--line);}
  .fp-mtitle{font-size:15px;font-weight:700;text-transform:capitalize;color:var(--ink);
    letter-spacing:.01em;text-align:center;flex:1;}
  .fp-mnav{cursor:pointer;user-select:none;color:var(--muted);font-size:22px;line-height:1;
    width:34px;height:34px;display:grid;place-items:center;border-radius:50%;}
  .fp-mnav:active{background:rgba(var(--wash,255,255,255),.08);}
  .fp-mon-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .fp-mon-wd{font-size:10px;font-weight:600;color:var(--muted);text-align:center;
    text-transform:uppercase;letter-spacing:.06em;padding-bottom:5px;}
  .fp-mon-wd.sun{color:var(--crit,#e2695f);}
  .fp-mon-c{min-height:34px;padding:5px 0;display:grid;place-items:center;font-size:13px;
    border-radius:var(--r-s);font-variant-numeric:tabular-nums;position:relative;color:var(--ink);cursor:pointer;}
  .fp-mon-c.sat{color:var(--muted);}                 /* Samstag dezent */
  .fp-mon-c.sun{color:var(--crit,#e2695f);}                       /* Sonntag + Feiertag rot */
  .fp-mon-c.holi{font-weight:700;}                    /* Feiertag zusaetzlich fett */
  .fp-mon-c.empty{visibility:hidden;}
  .fp-mon-c.ev{font-weight:600;}
  .fp-mon-c.ev::after{content:"";position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
    width:5px;height:5px;border-radius:var(--r-round,32%);background:var(--accent);}
  .fp-mon-c.holi.ev::after{background:var(--crit,#e2695f);}
  .fp-mon-c.sel{outline:2px solid var(--accent);outline-offset:-2px;}
  .fp-mon-c.today{background:var(--accent);color:var(--on-accent,#fff);font-weight:700;
    box-shadow:0 2px 8px rgba(0,0,0,.28);}
  .fp-mon-c.today.ev::after{background:var(--on-accent,#fff);}
  /* Kalenderfarben: ein Punkt vor dem Titel sagt, aus welchem Abo der Termin
     kommt. Schaltet die Einstellung sie ab, entfaellt der Punkt ersatzlos. */
  .cdot{display:inline-block;width:7px;height:7px;border-radius:var(--r-round,32%);margin-right:7px;
    vertical-align:1px;flex:none;}
  .fp-ev .note{font-size:12px;color:var(--muted);margin-left:8px;white-space:nowrap;}
  .fp-ev .cal{font-size:11px;color:var(--muted);margin-left:8px;white-space:nowrap;
    border:1px solid var(--line);border-radius:999px;padding:1px 7px;}
  .fp-leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:2px 0 8px;}
  .fp-mon + .fp-leg{margin-top:10px;justify-content:center;}
  .fp-leg span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
  .fp-leg i{width:8px;height:8px;border-radius:var(--r-round,32%);flex:none;}
  /* Monatsraster mit mehreren Kalendern: je Tag bis zu drei Farbpunkte statt
     des einen Akzentpunkts aus .ev::after. */
  .fp-mon-c .mdots{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
    display:flex;gap:2px;pointer-events:none;}
  .fp-mon-c .mdots i{width:5px;height:5px;border-radius:var(--r-round,32%);background:var(--accent);}
  .fp-mon-c.ev.dots::after{display:none;}
  /* Auf dem Akzent-Hintergrund des heutigen Tages waeren farbige Punkte kaum
     zu sehen — dort gewinnt die Lesbarkeit gegen die Inline-Farbe. */
  .fp-mon-c.today .mdots i{background:var(--on-accent,#fff) !important;}
  .fp-allbtn{background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;padding:2px 4px;}
  .fp-ev.holi .tm{color:var(--crit,#e2695f);}
  .moreb{position:absolute;top:6px;right:8px;z-index:6;width:34px;height:34px;border-radius:50%;
    display:grid;place-items:center;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;
    background:rgba(var(--wash,255,255,255),.06);}
  .moreb:active{transform:scale(.92);}
  /* PIN-Eingabe im Kartenstil: grosse Pillen, Punkte-Anzeige, Abbrechen = x oder daneben tippen */
  .pinov{position:absolute;inset:0;z-index:45;background:rgba(0,0,0,.55);display:grid;place-items:center;}
  .pinbox{background:var(--face-1,var(--screen));color:var(--ink);border-radius:var(--r-xl);padding:14px 16px 16px;
    width:min(92%,380px);max-height:96%;box-shadow:0 20px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:10px;}
  .pinhd{display:flex;align-items:center;justify-content:space-between;min-height:40px;}
  .pinttl{font-weight:700;font-size:18px;padding-left:6px;}
  .pinx{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:var(--tile);font-size:18px;}
  .pindisp{font-family:var(--font-num,"Sora",sans-serif);font-size:30px;text-align:center;letter-spacing:.35em;min-height:40px;line-height:40px;}
  .pinmsg{color:var(--crit-txt);font-size:14px;text-align:center;min-height:0;}
  .pinmsg:empty{display:none;}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .pinkey{height:52px;border-radius:var(--r-pill);display:grid;place-items:center;font-family:var(--font-num,"Sora",sans-serif);
    font-size:22px;font-weight:600;cursor:pointer;user-select:none;background:var(--tile);color:var(--ink);}
  .pinkey:active{transform:scale(.96);}
  .pinkey.ok{background:var(--ink);color:var(--tile);font-size:18px;}
  .pinkey.del{font-size:22px;}
  /* ==== Layout-Redesign (UI-Mockup 09/2026): Tab-Leiste oben auf dem Rahmen,
     darunter EINE abgerundete Karte je Tab in dessen Farbe, weisse Kacheln.
     Farben kommen als Variablen vom Server (Config -> Aussehen -> Design);
     die Fallbacks entsprechen der Vorlage "bunt". Grundraster 480x480 (3x3 a
     160 px): Leiste 60 px + Abstaende, Karte 456x388; im Split (960x480) zwei
     Karten nebeneinander unter einer gemeinsamen Leiste. ==== */
  .screen{background:var(--bezel,var(--bg));box-shadow:none;
    grid-template-rows:auto minmax(0,1fr);--face:var(--face-1,var(--screen));--dot:var(--dot-1,var(--accent));}
  .screen>.tabs{grid-row:1;grid-column:1/-1;height:52px;margin:8px 12px 0;padding:0;gap:4px;
    border-top:0;background:transparent;justify-content:space-between;align-items:center;}
  .screen>.tabs .tab{flex:0 1 64px;height:52px;padding:0;border-radius:var(--r-m);color:var(--tab-idle,var(--muted));
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;}
  .screen>.tabs .tab::after{content:"";width:5px;height:5px;border-radius:1.5px;background:transparent;}
  .screen>.tabs .tab svg,.screen>.tabs .tab .tico{width:26px;height:26px;}
  .screen>.tabs .tab.active{background:var(--tab-active,rgba(255,255,255,.08));color:var(--tab-active-ink,var(--accent));}
  .screen>.tabs .tab.active::after{background:var(--dot);}
  .screen>.tabs .tab .tico{background-color:var(--tab-idle,var(--muted));}
  .screen>.tabs .tab.active .tico{background-color:var(--tab-active-ink,var(--accent));}
  .screen>.tabs .tabspacer{flex:1 1 auto;}
  /* Pfad-Symbole neben dem Zurueck-Knopf */
  /* pointer-events:auto: .tabspacer ist sonst nicht antippbar (Platzhalter) */
  .screen>.tabs .crumbs{min-width:0;display:flex;align-items:center;padding-left:4px;overflow:hidden;pointer-events:auto;}
  .crumb{flex:0 1 44px;min-width:36px;height:52px;border-radius:var(--r-m);display:grid;place-items:center;cursor:pointer;
    color:var(--dot);animation:crumbIn calc(160ms * var(--anim-scale)) var(--ease) both;}
  .crumb.cur{background:rgba(var(--bezel-ink-rgb,255,255,255),.06);}
  .crumb .ico,.crumb .icowrap,.crumb .blindico,.crumb .windowico{--ico:var(--dot);--ico-fixed:var(--dot);color:var(--dot);}
  .crumb .ico,.crumb .ico.img{display:inline-grid;place-items:center;width:26px;height:26px;}
  .crumb .ico.img{background-color:var(--dot);-webkit-mask:var(--u) no-repeat center/contain;mask:var(--u) no-repeat center/contain;}
  .crumb svg,.crumb .rawico{width:26px;height:26px;}
  .crsep{flex:none;width:12px;display:grid;place-items:center;color:var(--tab-idle,var(--muted));opacity:.6;}
  .crsep svg{width:16px;height:16px;}
  @keyframes crumbIn{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:none;}}
  /* Zurueck: links, gleiche Form wie ein Tab (ohne Punkt). */
  .screen>.tabs .tabback{flex:0 1 64px;width:auto;height:52px;margin:0;border:0;border-radius:var(--r-m);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:0;
    color:var(--tab-idle,var(--muted));background:transparent;}
  .screen>.tabs .tabback svg{width:24px;height:24px;}
  .screen>.tabs .tabback.dash svg{width:36px;height:36px;}   /* Dashboard-Symbol (Layout-Abbild) etwas groesser */
  .screen>.tabs .tabback::after{content:"";width:5px;height:5px;}
  .screen>.tabs .tabback.on{color:var(--tab-active-ink,#fff);background:rgba(var(--bezel-ink-rgb,255,255,255),.06);}
  .screen>.grid,.screen>.scrollind,.screen>.conn{grid-row:2;}
  .screen>.grid{margin:10px 12px 12px;border-radius:var(--r-xl);background:var(--face);padding:14px;--gap:10px;}
  .screen>.grid.snapy{scroll-padding-top:14px;}
  .screen>.scrollind{margin:30px 16px;}
  .screen.split>.grid{margin-right:6px;}
  .screen.split>#playerpane,.screen.split>#frontpane{grid-row:2;grid-column:2;margin:10px 12px 12px 6px;
    border-left:0;border-radius:var(--r-xl);background:var(--face-n,var(--screen));}
  .tile{background:var(--tile);border:0;border-radius:var(--r-l);}
  /* contain: Aenderung in einer Kachel zeichnet nur diese Kachel neu, nicht die Seite */
  .tile,.scene,.sbar{contain:layout paint;}
  /* Grosse Zahlen (Mockup): Nachkommastelle/Einheit 65 %, heller */
  .pbig{font-size:clamp(64px,22vw,120px);font-weight:600;letter-spacing:-.04em;line-height:1;white-space:nowrap;overflow:hidden;}
  .pbig small{font-size:.6em;font-weight:600;letter-spacing:-.02em;color:var(--muted);}
  /* Nicht stauchen (sonst schneidet overflow:hidden die Zahl ab) - passt es
     nicht, verkleinert fitBig() die Zahl bzw. blendet das Symbol aus. */
  .grid.panel .pantop>.pbig,.grid.panel .pantop>.hero,.grid.panel .pantop>.status{flex-shrink:0;}
  /* Kopf der Detailseite: Raum + Bausteinname */
  .dhead{flex-shrink:0;text-align:center;position:relative;z-index:1;padding-top:2px;}
  .dhead .droom{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .dhead .dname{font-family:var(--font-num,"Sora",var(--font,"Manrope",sans-serif));font-weight:600;font-size:22px;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* Kopf oben, der Rest (Wert, Status) mittig im verbleibenden Raum */
  .grid.panel .pantop>.dhead+*{margin-top:auto;}
  .grid.panel .pantop>.dhead~:last-child{margin-bottom:auto;}
  /* Reine Anzeige: Piktogramm uebergross im Hintergrund, links unten angeschnitten */
  .grid.panel{position:relative;}
  .grid.panel>.pantop,.grid.panel>.panbot{position:relative;z-index:1;}
  /* Hintergrund-Symbol links unten angeschnitten: die Box ist genau so gross
     wie die Karte und schneidet ab - sonst vergroesserte das ueberstehende
     Symbol die Scrollflaeche und die Detailansicht bekam einen Scrollbalken. */
  .dbg{position:absolute;inset:0;overflow:hidden;border-radius:inherit;z-index:0;pointer-events:none;
    color:var(--ink);opacity:.08;}
  .dbg>*{position:absolute;left:-70px;bottom:-80px;width:330px;height:330px;}
  .dbg svg{stroke-width:.7;}
  .dbg .rawico{object-fit:contain;}
  .dbg .dbgm{display:block;background-color:var(--ink);
    -webkit-mask:var(--u) no-repeat center/contain;mask:var(--u) no-repeat center/contain;}
  /* Zustandsflaeche (Alarmanlage, Rauchmelder, Wecker klingelt): farbig je Zustand */
  .dstate{flex:1 1 auto;min-height:0;align-self:stretch;border-radius:var(--r-l);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:6px;padding:10px;background:rgba(var(--wash,255,255,255),.05);}
  .dstate .sico svg{width:44px;height:44px;}
  .dstate .pbig{font-size:clamp(40px,13vw,72px);max-width:100%;}
  .dstate .ssub{font-size:18px;color:var(--muted);text-align:center;}
  .dstate.tone-good{background:rgba(var(--good-rgb,82,184,129),.14);color:var(--good-txt);}
  .dstate.tone-crit{background:rgba(var(--crit-rgb,226,107,95),.18);color:var(--crit-txt);animation:critPulse 1.6s ease-in-out infinite;}
  .dstate.tone-good .pbig,.dstate.tone-crit .pbig{color:inherit;}
  @keyframes critPulse{0%,100%{opacity:1;}50%{opacity:.72;}}
  html[data-motion="mid"] .dstate,html[data-motion="off"] .dstate{animation:none;}
  /* Tuerstation: Livebild fuellt die Karte, Klingel-Hinweis im Bild */
  .grid.panel .pantop>.video{flex:1 1 auto;min-height:0;aspect-ratio:auto;border-radius:var(--r-l);position:relative;align-self:stretch;}
  .grid.panel .pantop>.video img{object-fit:cover;}
  .video .vbell{position:absolute;left:12px;top:12px;background:var(--crit-txt);color:#fff;border-radius:var(--r-pill);padding:6px 12px;
    font-weight:700;font-size:14px;animation:critPulse 1.6s ease-in-out infinite;}
  /* Tor: Fuellstand von unten = offen */
  .shade.open .sbar.pos i{top:auto;bottom:0;}
  /* Anzeige-Flaeche ohne Bedienung / Anzeige-Kacheln */
  .dimcard.ro{cursor:default;}
  .scene.ro{cursor:default;}
  .scene .stx{display:flex;flex-direction:column;gap:2px;min-width:0;}
  /* Kacheln unter einem grossen Wert (Wecker, Bewaesserung, Zentral): flach, Symbol links */
  .pantop>.pbig ~ .scenes{grid-auto-rows:minmax(72px,calc((100% - 10px) / 2));}
  .pantop>.pbig:has(~ .scenes){font-size:clamp(48px,15vw,84px);}
  .pantop>.pbig ~ .scenes .scene{flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;padding:10px 16px;border-radius:var(--r-l);}
  .pantop>.pbig ~ .scenes .sico svg{width:24px;height:24px;}
  .scene .ssub{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .scene .ssub:empty{display:none;}
  .scene .sico svg.sli{width:44px;height:44px;margin:-6px 0 0 -6px;}
  .scene.on .ssub{color:inherit;opacity:.75;}
  /* Protokoll: Zeilen mit Zeit links, neueste oben */
  .dlog{flex:1 1 auto;min-height:0;align-self:stretch;overflow-y:auto;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain;}
  .dlog>div{background:var(--tile);border-radius:var(--r-m);padding:10px 14px;display:flex;gap:14px;font-size:15px;align-items:baseline;}
  .dlog b{font-family:var(--font-num,"Sora",sans-serif);font-weight:600;font-size:15px;min-width:52px;white-space:nowrap;color:var(--muted);}
  /* Energie: Radial gross, Kennzahlen darunter */
  .grid.panel .pantop>.epane-detail{flex:1 1 auto;min-height:0;width:100%;margin:0;}
  .grid.panel .pantop>.epane-detail .epane{height:100%;}
  /* Titel und Summenzeile stehen schon im Kopf bzw. in den Kennzahlen */
  .grid.panel .pantop>.epane-detail .ettl,.grid.panel .pantop>.epane-detail .ebot{display:none;}
  /* Beschriftung im Radial: SVG wird verkleinert gezeichnet -> groesser setzen (real ~13 px) */
  .grid.panel .pantop>.epane-detail .enval{font-size:26px;} .grid.panel .pantop>.epane-detail .enlab{font-size:22px;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;align-self:stretch;flex-shrink:0;}
  .kpis>div{background:var(--tile);border-radius:var(--r-m);padding:8px 12px;display:flex;flex-direction:column;gap:2px;}
  .kpis span{font-size:13px;color:var(--muted);} .kpis b{font-family:var(--font-num,"Sora",sans-serif);font-size:18px;font-weight:600;}
  /* Audio: Cover transparent im Hintergrund, Titel mittig, Lautstaerke-Balken rechts */
  .dcover{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;border-radius:inherit;}
  .dcover img{width:100%;height:100%;object-fit:cover;opacity:.45;}
  .dcover::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,var(--face) 85%);}
  .amid{flex:1 1 auto;min-height:0;align-self:stretch;display:flex;gap:12px;align-items:stretch;}
  .amid .amsp{width:44px;flex:none;}
  .amid .amt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;text-align:center;}
  .amid .amt b{font-family:var(--font-num,"Sora",sans-serif);font-weight:600;font-size:26px;line-height:1.2;}
  .amid .amt span{font-size:18px;color:var(--muted);}
  .avol{width:44px;flex:none;display:flex;flex-direction:column;gap:6px;}
  .avol .btn{flex:none;height:44px;border-radius:var(--r-pill);background:var(--tile);display:grid;place-items:center;padding:0;border:0;color:var(--ink);}
  .avol .btn svg{width:20px;height:20px;}
  .avbar{flex:1;min-height:0;border-radius:var(--r-l);background:rgba(var(--wash,255,255,255),.08);position:relative;overflow:hidden;
    display:grid;place-items:end center;touch-action:none;cursor:ns-resize;}
  .avbar i{position:absolute;left:0;right:0;bottom:0;background:var(--dot,var(--accent));opacity:.7;}
  .avbar b{position:relative;font-family:var(--font-num,"Sora",sans-serif);font-size:15px;margin-bottom:8px;}
  /* Wecker bearbeiten: + ueber / - unter Stunde und Minute, Wochentage, An/Aus/Speichern */
  .aedit{flex:1 1 auto;min-height:0;align-self:stretch;display:flex;flex-direction:column;gap:10px;justify-content:space-between;}
  .aetime{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:0;}
  .aecol{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .aecol .btn{flex:none;width:112px;height:44px;border-radius:var(--r-pill);background:var(--tile);display:grid;place-items:center;padding:0;border:0;color:var(--ink);}
  .aecol .btn svg{width:22px;height:22px;}
  .aedit .pbig{font-size:80px;} .aedit .aesep{color:var(--muted);}
  .aedays{display:flex;gap:6px;}
  .aedays .btn{flex:1;height:44px;border-radius:var(--r-pill);background:var(--tile);display:grid;place-items:center;padding:0;border:0;
    color:var(--ink);font-weight:600;font-size:14px;}
  .aedays .btn.on{background:var(--ink);color:var(--tile);} .aedays .btn.ro{opacity:.4;}
  /* Mehr Kontrast (Config): Kacheln und Knoepfe heben sich mit weichem Schatten
     von der Karte ab. Aus = flach (spart Rechenleistung auf schwachen Panels). */
  html[data-contrast="1"] .tile,html[data-contrast="1"] .scene:not(.on),html[data-contrast="1"] .brow .btn:not(.on),
  html[data-contrast="1"] .sbar:not(.on):not(.pos),html[data-contrast="1"] .aedays .btn:not(.on),html[data-contrast="1"] .aecol .btn,
  html[data-contrast="1"] .avol .btn,html[data-contrast="1"] .kpis>div,html[data-contrast="1"] .dlog>div,
  html[data-contrast="1"] .pinkey:not(.ok),html[data-contrast="1"] .pinx{
    box-shadow:0 1px 2px rgba(0,0,0,.10),0 4px 12px rgba(0,0,0,.10);}
  /* Kleines Piktogramm ueber dem grossen Wert (der Wert ist die Hauptsache) */
  .grid.panel .hero .circle{width:56px;height:56px;}
  .grid.panel .hero .circle svg,.grid.panel .hero .circle .himg,.grid.panel .hero .circle .rawico{width:28px;height:28px;}
  /* Mockup-Schriftgroessen: Nebentexte mind. 17 px, Titel in der Zahlen-/Titelschrift */
  .grid.panel .status{font-size:18px;}
  .grid.panel .ptitle{font-family:var(--font-num,"Sora",var(--font,"Manrope",sans-serif));font-size:22px;font-weight:600;}
  .grid.panel .ptitle .psub{font-family:var(--font,"Manrope",sans-serif);font-size:18px;font-weight:400;}
  .grid.panel.anchorbot .pantop>.scenes,.grid.panel.anchorbot .pantop>.shade,.grid.panel.anchorbot .pantop>.dimcard{flex:1 1 auto;min-height:0;align-self:stretch;}
  .grid.panel.anchorbot .pantop:has(.scenes),.grid.panel.anchorbot .pantop:has(.shade),.grid.panel.anchorbot .pantop:has(.dimcard){justify-content:flex-start;}
  /* Szenen/Beschattung/Dimmer scrollen bzw. passen sich INNEN an -> hier darf
     .pantop schrumpfen (sonst wuchs das 2x2-Szenenraster seit #81 ueber den Schirm). */
  .grid.panel.anchorbot .pantop:has(>.scenes),.grid.panel.anchorbot .pantop:has(>.shade),.grid.panel.anchorbot .pantop:has(>.dimcard),
  .grid.panel.anchorbot .pantop:has(>.epane-detail),.grid.panel .pantop:has(>.epane-detail),
  .grid.panel .pantop:has(>.video){flex:1 1 0;min-height:0;}   /* Kamerabild passt in die Seite (kein Scrollen) */
  .grid.panel .pantop>.epane-detail{overflow:hidden;}
  /* Breite Detailseite: Worte (Status wie "Kein Alarm") kleiner als Zahlen -
     ueber die volle Breite wirken sie sonst wie Plakatschrift */
  .grid.panel.wide .pbig.word,.grid.panel.wide .dstate .pbig.word{font-size:clamp(44px,6.5vw,76px);}
  /* Listen (offene Fenster, Meldungen) auf breiter Seite zweispaltig */
  .grid.panel.wide .alist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-width:none;align-content:start;}
  /* Lichtszenen 2x2 (weitere Seiten per Wischen) */
  .scenes{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:calc((100% - 10px) / 2);gap:10px;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;will-change:scroll-position;
    overflow-y:auto;scroll-snap-type:y mandatory;}
  .scene{background:var(--tile);border-radius:var(--r-l);padding:16px;display:flex;flex-direction:column;justify-content:space-between;
    color:var(--ink);cursor:pointer;scroll-snap-align:start;min-height:0;touch-action:pan-y;}
  .scene .sico svg{width:32px;height:32px;}
  .scene b{font-family:var(--font-num,"Sora",var(--font,"Manrope",sans-serif));font-weight:600;font-size:20px;line-height:1.15;}
  .scene.on{background:var(--ink);color:var(--tile);}
  /* Beschattung: hoch / Stellung / runter */
  .shade{display:flex;flex-direction:column;gap:8px;}
  .sbar{flex:1;min-height:0;background:var(--tile);border-radius:var(--r-l);display:grid;place-items:center;color:var(--ink);cursor:pointer;}
  .sbar svg{width:36px;height:36px;}
  .sbar.on{background:var(--ink);color:var(--tile);}
  .sbar.pos{flex:1.6;position:relative;overflow:hidden;cursor:default;background:rgba(var(--wash,255,255,255),.05);}
  .sbar.pos i{position:absolute;left:0;right:0;top:0;background:var(--dot,var(--accent));opacity:.45;transition:height .3s var(--ease);}
  .sbar.pos .pbig{position:relative;font-size:clamp(48px,14vw,76px);}
  /* Dimmen: Flaeche = Regler */
  .dimcard{position:relative;border-radius:var(--r-l);overflow:hidden;display:grid;place-items:center;touch-action:none;cursor:ns-resize;
    background:rgba(var(--wash,255,255,255),.05);}
  .dimcard i{position:absolute;left:0;right:0;bottom:0;background:var(--glow);opacity:.5;}
  .dimcard.heat i{background:var(--dot-3,#ff9e7a);opacity:.55;}
  .dimcard .dimtxt{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;}
  .dimcard .dcap,.dimcard .dsub{font-size:15px;color:var(--muted);}
  /* Aktionsreihe: alle Knoepfe als gleich hohe Pille (56 px).
     Breiten: 1 Pille = 1/2 (mittig), 2 Pillen = je 1/4 (mittig), mehr = teilen
     sich die Breite. Der Verlauf ist die unwichtigste Aktion: neben anderen im
     Goldenen Schnitt kleiner (1 : 1,618), allein 1/5 breit am rechten Rand. */
  .brow.act{justify-content:center;align-items:center;gap:10px;min-height:56px;}
  .brow.act .btn{flex:1.618 1 0;min-width:0;width:auto;height:56px;padding:0 14px;border-radius:var(--r-pill);border:0;display:grid;place-items:center;
    background:var(--tile);color:var(--ink);font-weight:600;font-size:15px;}
  .brow.act .btn.cht{flex:1 1 0;}
  .brow.act .btn.cht{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;padding:0 10px;}
  .brow.act.n1:not(.hasc) .btn{flex:0 0 50%;}
  .brow.act.n2:not(.hasc) .btn{flex:0 0 calc(25% - 5px);}
  .brow.act.n0.hasc{justify-content:flex-end;}
  .brow.act.n0.hasc .btn.cht{flex:0 0 20%;}
  .brow.act .btn svg{width:28px;height:28px;}
  .brow.act .btn.on{background:var(--ink);color:var(--tile);}   /* aktueller Zustand (Ein/Aus, Modus) */
  /* Rueckmeldung: sofort gedrueckt, "gesendet" pulsiert bis zur Bestaetigung */
  .btn:active,.sbar:active,.tile:active,.ub:active,.tapbtn:active{transform:scale(.96);opacity:.85;transition:none;}
  /* Szenen: beim Scrollen liegt der Finger auf einer Szene -> kein Skalieren (sonst ruckelt das Scrollen), nur leicht abdunkeln */
  .scene:active{opacity:.85;}
  .sent{animation:sentPulse .9s ease-in-out infinite !important;}
  @keyframes sentPulse{0%,100%{opacity:1;}50%{opacity:.55;}}
  .tile .name,.pbig,.saver .sv-time,.svw-clock .t,.sv-wx .now .t,.cpval,.fp-now .t{
    font-family:var(--font-num,"Sora",var(--font,"Manrope",system-ui,sans-serif));}
  /* Zoom-Uebergang: Inhalt der neuen Seite kurz verzoegert einblenden,
     der zurueckschrumpfenden Seite sofort ausblenden. */
  :root{--zoom-dur:calc(240ms * var(--anim-scale));--zoom-ease:cubic-bezier(.2,0,0,1);}
  /* Animationsstufe "Mittel": nur Ueberblendungen (Kachel-/Seitenwechsel,
     Screensaver). Alles, was sich bewegt oder pulsiert, bleibt stehen. */
  html[data-motion="mid"] .crumb,html[data-motion="mid"] .sent,html[data-motion="mid"] .tabback,
  html[data-motion="mid"] .edot{animation:none !important;}
  html[data-motion="mid"] .btn:active,html[data-motion="mid"] .tile:active,html[data-motion="mid"] .sbar:active,
  html[data-motion="mid"] .ub:active,html[data-motion="mid"] .tapbtn:active{transform:none;}
  .zghost{position:absolute;z-index:20;grid-area:1/1/-1/-1;pointer-events:none;border-radius:var(--r-l);
    background:var(--tile);transform-origin:0 0;will-change:transform,opacity;}
  .zghost.grow{transition:transform var(--zoom-dur,240ms) var(--zoom-ease,cubic-bezier(.2,0,0,1));}
  .zghost.shrink{transition:transform calc(260ms * var(--anim-scale)) var(--zoom-ease,cubic-bezier(.2,0,0,1));}
  .zghost.fade{opacity:0;transition:opacity calc(160ms * var(--anim-scale)) linear;}
  .grid.zhide>*{visibility:hidden;}
  .updown .ub,.prevnext .ub{width:30px;height:30px;border-radius:50%;
    background:rgba(var(--wash,255,255,255),.08);color:var(--ink);}
  .tswitch{background:rgba(var(--wash,255,255,255),.2);border-color:transparent;}
  .tile.good,.tile.crit{border-width:2px;}
  /* Screensaver = Ruhemodus auf dem Rahmen: helle Schrift, Karten leicht getoent. */
  .saver{color:var(--bezel-ink,var(--ink));--ink:var(--bezel-ink,#e7ede7);--muted:var(--tab-idle,#9fb0a4);
    --wash:var(--bezel-ink-rgb,255,255,255);--line:rgba(var(--bezel-ink-rgb,255,255,255),.08);
    --tile:rgba(var(--bezel-ink-rgb,255,255,255),.06);}

  /* ===== Status-Widget (Ampel) ===== */
  .svw.svw-status-cell{container-type:size;}
  .stw{height:100%;box-sizing:border-box;border-radius:var(--tile-r,18px);padding:clamp(8px,6cqmin,16px);display:flex;flex-direction:column;gap:clamp(5px,4cqmin,10px);cursor:pointer;overflow:hidden;}
  .stw.lv-ok{background:#D2EDE0;color:#0F5132;} .stw.lv-hint{background:#FAE6B8;color:#633806;} .stw.lv-alarm{background:#F5C9C9;color:#791F1F;}
  .sthd{display:flex;align-items:center;gap:clamp(5px,4cqmin,10px);font-weight:600;font-size:clamp(12px,9cqmin,22px);line-height:1.1;min-width:0;}
  .sthd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sthi{width:1.15em;height:1.15em;flex:none;display:grid;}
  .sthi svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .stbody{flex:1;min-height:0;display:flex;gap:clamp(5px,4cqmin,10px);}
  .stchips{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:clamp(4px,3cqmin,8px);flex:1;min-width:0;}
  .stw.wide:not(.tall) .stchips{flex:0 0 46%;}
  .stw.tall .stbody{flex-direction:column;} .stw.tall .stchips{flex:0 0 auto;grid-template-columns:repeat(2,1fr);grid-auto-rows:auto;}
  .stw.wide.tall .stchips{grid-template-columns:repeat(4,1fr);}
  .stchip{border:0;border-radius:clamp(7px,5cqmin,12px);padding:clamp(4px,3cqmin,9px) clamp(5px,3.5cqmin,10px);display:flex;align-items:center;gap:clamp(4px,2.5cqmin,7px);min-width:0;font:inherit;
    font-size:clamp(10px,6.5cqmin,15px);font-weight:600;cursor:pointer;background:rgba(255,255,255,.62);color:inherit;text-align:left;touch-action:manipulation;line-height:1.15;}
  .stchip .stn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .stchip .stt{font-weight:500;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stw.wide .stchip{flex-wrap:wrap;align-content:center;} .stw.wide .stchip .stn{flex:1;} .stw.wide .stchip .stt{width:100%;font-size:.88em;}
  .stchip.lv-hint{background:#E8AE3C;color:#412402;} .stchip.lv-alarm{background:#DC5654;color:#fff;} .stchip.lv-info{background:#C2DAF2;color:#0C447C;}
  .stci{width:1.15em;height:1.15em;flex:none;background:currentColor;-webkit-mask:var(--u) center/contain no-repeat;mask:var(--u) center/contain no-repeat;}
  .stci.svg{background:none;-webkit-mask:none;mask:none;display:grid;} .stci.svg svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;}
  .stlist{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(3px,2.5cqmin,6px);overflow:hidden;}
  .stli{background:rgba(255,255,255,.62);border-radius:clamp(7px,5cqmin,12px);padding:clamp(4px,2.5cqmin,8px) clamp(6px,3.5cqmin,10px);font-size:clamp(10px,5.5cqmin,14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;}
  .stli.lv-hint{background:rgba(232,174,60,.45);} .stli.lv-alarm{background:rgba(220,86,84,.35);}
  .stlog{font-size:clamp(9px,4.5cqmin,12px);opacity:.8;margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stft{font-size:clamp(10px,5.5cqmin,14px);line-height:1.25;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;}
  .stw.tall .stft{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  /* Standard: passend zum Hintergrund (wie die anderen Widgets: Kachelfarbe des Designs
     bzw. dunkel im Dashboard); die Ampel zeigt sich ueber Akzentfarben */
  .stw.look-auto{background:var(--tile);border:1px solid var(--line);color:var(--ink);
    --st-ok:#43b581;--st-hint:#e0a24d;--st-alarm:#e25c5a;--st-info:#5b9bd5;}
  .stw.look-auto .sthd{color:var(--st-ok);} .stw.look-auto.lv-hint .sthd{color:var(--st-hint);} .stw.look-auto.lv-alarm .sthd{color:var(--st-alarm);}
  .stw.look-auto.lv-alarm{border-color:color-mix(in srgb,var(--st-alarm) 70%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--st-alarm) 50%,transparent);}
  .stw.look-auto .stchip{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink);}
  .stw.look-auto .stchip .stci{color:var(--muted);}
  .stw.look-auto .stchip.lv-hint{background:color-mix(in srgb,var(--st-hint) 26%,transparent);} .stw.look-auto .stchip.lv-hint .stci{color:var(--st-hint);}
  .stw.look-auto .stchip.lv-alarm{background:color-mix(in srgb,var(--st-alarm) 34%,transparent);} .stw.look-auto .stchip.lv-alarm .stci{color:var(--st-alarm);}
  .stw.look-auto .stchip.lv-info{background:color-mix(in srgb,var(--st-info) 24%,transparent);} .stw.look-auto .stchip.lv-info .stci{color:var(--st-info);}
  .stw.look-auto .stli{background:color-mix(in srgb,var(--ink) 7%,transparent);}
  .stw.look-auto .stli.lv-hint{background:color-mix(in srgb,var(--st-hint) 22%,transparent);} .stw.look-auto .stli.lv-alarm{background:color-mix(in srgb,var(--st-alarm) 28%,transparent);}
  .stw.look-auto .stft,.stw.look-auto .stlog{color:var(--muted);opacity:1;}
  /* Status-Seite (Tipp auf die Kachel) */
  .stsheet{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:16px;}
  .stsheet[hidden]{display:none;}
  /* Info-Popups (Status, Wetter): einheitlicher Rahmen - gleiche Breite, Raender,
     Radius, Schatten; Hoehe nach Inhalt; Kopf = Symbol, Titel, (Extra), X rechts oben. */
  .stsbox,.wxsbox{width:min(440px,100%);max-height:100%;overflow:auto;border-radius:var(--r-l);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 40px rgba(0,0,0,.35);}
  .stsbox .sthd,.wxsbox .wxhd{display:flex;align-items:center;gap:10px;min-height:34px;}
  .stsbox .sthd .sthi,.wxsbox .wxhd .wxico,.wxsbox .wxhd .wxico svg{width:30px;height:30px;flex:none;}
  .stsbox .stsx,.wxsbox .stsx{margin-left:auto;flex:none;align-self:flex-start;}
  .stsbox.lv-ok{background:#D2EDE0;color:#0F5132;} .stsbox.lv-hint{background:#FAE6B8;color:#633806;} .stsbox.lv-alarm{background:#F5C9C9;color:#791F1F;}
  .stsbox .sthd{font-size:20px;}
  .stsx{margin-left:auto;border:0;background:rgba(255,255,255,.6);color:inherit;width:34px;height:34px;border-radius:50%;font-size:14px;cursor:pointer;}
  .strow{display:flex;align-items:center;gap:10px;border:0;border-radius:var(--r-m);padding:12px 14px;font:inherit;font-size:15px;background:rgba(255,255,255,.7);color:var(--ink,#1f2440);cursor:pointer;text-align:left;}
  .strow .stci{width:20px;height:20px;} .strow .stn{display:flex;flex-direction:column;min-width:0;font-weight:600;}
  .stroom{font-weight:700;}
  /* Wetter-Tagesdetails (Popup im Stil des Status-Fensters, Pastell-Blau) */
  .wxtap{cursor:pointer;border-radius:var(--r-m);transition:background var(--anim-fast,.15s) ease;}
  .wxtap:active{background:rgba(var(--wash,255,255,255),.12);}
  .wxsbox{background:var(--face-2,var(--tile,#D3E8FF));color:var(--ink,#1f2440);}
  .wxsbox .stsx{background:rgba(var(--wash,255,255,255),.10);}
  @keyframes wxin{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  .wxtt{display:flex;flex-direction:column;min-width:0;} .wxtt b{font-size:20px;font-family:var(--font-num,"Sora",var(--font,"Manrope",system-ui,sans-serif));font-weight:var(--name-weight,450);} .wxtt small{font-size:13px;color:var(--muted);}
  .wxhl{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;line-height:1.05;font-variant-numeric:tabular-nums;}
  .wxhl b{font-size:26px;font-weight:600;font-family:var(--font-num,inherit);} .wxhl small{font-size:15px;font-weight:600;}
  .wxhd .wxhl+.stsx{margin-left:6px;}
  .wxchart{width:100%;height:auto;display:block;background:var(--tile,rgba(255,255,255,.55));border-radius:var(--r-m);overflow:visible;}
  .wxline{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;
    stroke-dasharray:1;stroke-dashoffset:1;animation:wxdraw .9s var(--ease,ease) .15s forwards;}
  @keyframes wxdraw{to{stroke-dashoffset:0}}
  .wxarea{opacity:0;animation:wxfade .6s ease .55s forwards;} @keyframes wxfade{to{opacity:1}}
  .wxbar{fill:#8ab8f2;opacity:.9;transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:wxgrow .45s var(--ease,ease) forwards;}
  @keyframes wxgrow{to{transform:scaleY(1)}}
  .wxpt{fill:var(--tile,#fff);stroke-width:2.4;opacity:0;animation:wxfade .3s ease 1s forwards;}
  .wxlab{font-size:12px;font-weight:700;fill:var(--ink,#1f2440);text-anchor:middle;opacity:0;animation:wxfade .3s ease 1s forwards;}
  .wxax{font-size:10px;fill:var(--muted,#565c7c);}
  .wxnight{fill:var(--ink,#1f2440);opacity:.06;}
  .wxrad{fill:#f6d27a;opacity:.55;}
  .wxhz{stroke:var(--muted,#565c7c);stroke-opacity:.35;stroke-width:1;stroke-dasharray:3 3;}
  .wxsun{fill:#ffd36a;stroke:#fff6d6;stroke-width:2.5;filter:drop-shadow(0 0 6px rgba(255,200,80,.8));opacity:0;animation:wxfade .4s ease 1s forwards;}
  .wxttl{font-size:11px;font-weight:700;fill:var(--muted,#565c7c);letter-spacing:.02em;}
  .wxc.wxsel{cursor:pointer;transition:box-shadow .2s ease,transform .15s ease;}
  .wxc.wxsel:active{transform:scale(.97);}
  .wxc.on{box-shadow:inset 0 0 0 2px var(--accent,#ffc145);}
  .wxchips{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;}
  .wxc{background:var(--tile,rgba(255,255,255,.7));border-radius:var(--r-m);padding:9px 12px;display:flex;flex-direction:column;gap:2px;opacity:0;animation:wxin .35s var(--ease,ease) forwards;}
  .wxc span{font-size:11px;color:var(--muted);} .wxc b{font-size:15px;font-variant-numeric:tabular-nums;}
  html[data-motion="off"] .wxsbox,html[data-motion="off"] .wxsbox *{animation:none!important;opacity:1;transform:none;stroke-dashoffset:0;}
  .strow .stn small{font-weight:400;font-size:12px;opacity:.75;line-height:1.35;} .strow .stn small:first-of-type{margin-top:2px;} .strow .stt{margin-left:auto;font-size:13px;opacity:.85;white-space:nowrap;} .strow .stgo{opacity:.5;font-size:18px;}
  .strow.lv-hint{background:#E8AE3C;color:#412402;} .strow.lv-alarm{background:#DC5654;color:#fff;} .strow.lv-info{background:#C2DAF2;color:#0C447C;}
  .stsbox .stlog{font-size:12px;white-space:normal;background:rgba(255,255,255,.5);border-radius:var(--r-m);padding:10px 12px;opacity:1;}
  .stsbox .stlog b{display:block;margin-bottom:4px;}

  /* ===== Alarm-Vollbild =====
     Deckt den ganzen Bildschirm ab; Karte wie eine Detailseite (Radius,
     Kopf mit Raum/Name), Status gross in der Zahlen-Schrift, Aktionen als
     Pillen. Rot bewusst fest und pulsierend - muss auffallen. */
  .secal{position:absolute;inset:0;z-index:40;background:#2a0607;display:flex;gap:12px;padding:12px;overflow:auto;}
  .secbox{flex:1 1 0;min-width:0;border-radius:var(--r-xl);background:#C62F2D;color:#fff;display:flex;flex-direction:column;gap:10px;padding:18px 18px 16px;
    box-shadow:0 0 0 0 rgba(255,90,90,.6);animation:secpulse 1.6s ease-out infinite;}
  .screen:not(.split) .secal{flex-direction:column;}
  @keyframes secpulse{0%{box-shadow:0 0 0 0 rgba(255,90,90,.65);}100%{box-shadow:0 0 0 18px rgba(255,90,90,0);}}
  .secbox .dhead .droom{color:rgba(255,255,255,.8);} .secbox .dhead .dname{color:#fff;}
  .secstate{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:18px;}
  .secico{width:64px;height:64px;flex:none;}
  .secico svg{width:100%;height:100%;stroke:#fff;stroke-width:1.8;}
  .secbig{font-family:var(--font-num,"Sora",var(--font,"Manrope",system-ui,sans-serif));font-weight:600;font-size:56px;line-height:1;}
  .secsub{font-size:var(--sub-size,15px);opacity:.9;margin-top:6px;}
  /* Eine Reihe, alle Pillen gleich gross: aussen Zum Baustein/Ausblenden
     (leicht transparent), innen die Befehle (weiss) */
  .secrow{display:flex;gap:10px;}
  .secpill{flex:1 1 0;min-width:0;height:56px;padding:0 10px;border-radius:var(--r-pill);border:0;background:rgba(255,255,255,.16);color:rgba(255,255,255,.92);
    font:inherit;font-size:15px;font-weight:600;cursor:pointer;touch-action:manipulation;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .secpill:active{background:rgba(255,255,255,.3);}
  @media (max-width:600px){ .secrow{gap:8px;} .secpill{font-size:13px;padding:0 4px;} .secopt{display:none;} }
  .secpill.main{background:#fff;color:#8E1F1D;font-weight:700;}
  .secpill.main:active,.secpill.main.sent{background:#f3d3d3;}
  .sectap{display:none;width:max-content;margin-top:8px;font-size:13px;font-weight:600;background:rgba(0,0,0,.25);border-radius:999px;padding:4px 12px;}
  html.tone-blocked .sectap{display:block;}
  html[data-motion="off"] .secbox{animation:none;}

  /* Tuerstation: Tasten auf dem Livebild (leicht transparent) */
  .video .vrow{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;display:flex;flex-direction:column;gap:8px;}
  .video .vrow .btn{opacity:.86;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(0,0,0,.25);}
  .video .vrow .btn:active,.video .vrow .btn.on{opacity:1;}
  .video{overflow:hidden;}
  .video .vhead{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:2;max-width:calc(100% - 20px);
    border-radius:999px;padding:6px 18px;opacity:.86;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(0,0,0,.25);}
  .video .vhead .dhead{margin:0;padding:0;}

  /* ===== Status-Widget: Kachel-Standard =====
     Schrift wie die Kacheln (Kopf = Kachelname: Zahlen-Schrift, Theme-Groesse
     und -Staerke; Chips/Fusszeile = Statuszeile). Groessen folgen dem Theme,
     werden aber auf kleinen Zellen (3x3-Raster) gedeckelt, damit nichts
     ueberlaeuft. Form: Dashboard wie die anderen Widgets (Wetter),
     in Tabs wie eine Kachel (Radius, Schatten, Innenabstand). */
  .stw{border-radius:var(--r-tile,16px);padding:12px;gap:8px;}
  .grid .stw{border-radius:var(--r-l);padding:16px;}
  .grid .stw.look-auto{border:0;box-shadow:var(--tile-shadow,0 3px 10px rgba(0,0,0,.14));}
  .grid.cells.g3 .svw[data-sz="1x1"] .stw,.grid.cells.g3 .svw[data-sz="2x1"] .stw,.grid.cells.g3 .svw[data-sz="3x1"] .stw{padding:10px 12px;gap:6px;}
  .stw .sthd{font-family:var(--font-num,"Sora",var(--font,"Manrope",system-ui,sans-serif));
    font-size:min(var(--name-size,18px),12cqmin);font-weight:var(--name-weight,450);letter-spacing:-.01em;line-height:1.15;gap:.4em;}
  .stw .sthi{width:1.15em;height:1.15em;}
  .stw .stchip{font-size:min(calc(var(--sub-size,15px) * .87),8.5cqmin);font-weight:500;}
  .stw .stchip .stci{width:1.1em;height:1.1em;}
  .stw .stli{font-size:min(calc(var(--sub-size,15px) * .87),8cqmin);}
  .stw .stft{font-size:min(var(--sub-size,15px),8cqmin);font-weight:400;}
  .stw .stlog{font-size:min(calc(var(--sub-size,15px) * .8),7cqmin);}
  .stw.tall .sthd,.stw.wide.tall .sthd{font-size:min(calc(var(--name-size,18px) * 1.3),11cqmin);}
  .stsbox .sthd span{font-family:var(--font-num,"Sora",var(--font,"Manrope",system-ui,sans-serif));font-weight:var(--name-weight,450);}

  /* ===== Animierte Symbole =====
     Nur mit Haken "Animierte Symbole" (html.ianim) und nicht bei Animation
     "Keine". Dezent und nur transform/opacity/box-shadow (schwache Panels).
     Einmalig: an-pop (eingeschaltet / Ampel kippt), an-val (neuer Wert),
     an-chg (Ampel-Chip). Dauernd, solange es passiert: an-ring (Klingel,
     Wecker, Alarm), an-up/an-down (Jalousie faehrt), an-heat (heizt). */
  @keyframes icPop{0%{transform:scale(1);filter:brightness(1.3);}40%{transform:scale(1.12);}100%{transform:scale(1);filter:none;}}
  @keyframes valTick{0%{opacity:.35;transform:translateY(3px);}100%{opacity:1;transform:none;}}
  @keyframes chipFlash{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent);}100%{box-shadow:0 0 0 8px transparent;}}
  @keyframes icRing{0%,55%,100%{transform:rotate(0);}8%{transform:rotate(-12deg);}16%{transform:rotate(11deg);}24%{transform:rotate(-8deg);}32%{transform:rotate(6deg);}40%{transform:rotate(-3deg);}}
  @keyframes icBobUp{0%,100%{transform:translateY(0);}50%{transform:translateY(-2px);}}
  @keyframes icBobDown{0%,100%{transform:translateY(0);}50%{transform:translateY(2px);}}
  @keyframes icHeat{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.72;transform:scale(.95);}}
  @keyframes okDraw{from{stroke-dashoffset:14;}to{stroke-dashoffset:0;}}
  html.ianim:not([data-motion="off"]) .an-pop{animation:icPop .5s ease-out;}
  html.ianim:not([data-motion="off"]) .an-val{animation:valTick .5s ease-out;}
  html.ianim:not([data-motion="off"]) .stchip.an-chg{animation:chipFlash .9s ease-out;}
  html.ianim:not([data-motion="off"]) .stw.lv-ok .sthi.an-pop path:last-child{stroke-dasharray:14;animation:okDraw .5s ease-out;}
  html.ianim:not([data-motion="off"]) .tile.an-ring .head>:first-child,
  html.ianim:not([data-motion="off"]) .vbico,
  html.ianim:not([data-motion="off"]) .dstate.tone-crit .sico,
  html.ianim:not([data-motion="off"]) .secico{animation:icRing 1.6s ease-in-out infinite;transform-origin:50% 15%;}
  html.ianim:not([data-motion="off"]) .tile.an-up .head>:first-child,
  html.ianim:not([data-motion="off"]) .shade .sbar.on[data-dir="up"] svg{animation:icBobUp 1.1s ease-in-out infinite;}
  html.ianim:not([data-motion="off"]) .tile.an-down .head>:first-child,
  html.ianim:not([data-motion="off"]) .shade .sbar.on[data-dir="down"] svg{animation:icBobDown 1.1s ease-in-out infinite;}
  html.ianim:not([data-motion="off"]) .tile.an-heat .head>:first-child{animation:icHeat 2.4s ease-in-out infinite;}
  .vbell{display:inline-flex;align-items:center;gap:6px;}
  .vbico{width:16px;height:16px;display:grid;} .vbico svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2;}

  /* Scroll-Listen in Detailansichten: Reihen rasten ein, unten weiche Blende solange mehr folgt */
  .grid.panel .scenes{scroll-snap-type:y proximity;}
  /* Breite Detailseite (2 Flaechen, Tablet/X2): Szenen im 4er-Raster wie die
     Kacheln - je Szene eine Rasterzelle statt halber Seitenbreite */
  .grid.panel.wide .scenes{grid-template-columns:repeat(4,minmax(0,1fr));}
  .grid.panel.wide .scene b{font-size:18px;}
  .scenes.dense .scene{padding:10px 14px;} .scenes.dense .scene b{font-size:15px;} .scenes.dense .sico svg{width:24px;height:24px;}
  .grid.panel .scenes>.scene{scroll-snap-align:start;}
  .grid.panel .scenes.more{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 44px),transparent);}

  /* ===== Handy (Hochformat bzw. Profil "Handy") =====
     Volle Hoehe statt 480er-Kasten, Tabs unten in Daumen-Reichweite, Raender
     fuer Notch und Home-Balken. Kacheln bleiben etwa quadratisch (--gr per JS). */
  html.phone .screen,html.phone .screen.split,html.phone .screen.fill{width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;
    grid-template-rows:minmax(0,1fr) auto;grid-template-columns:1fr;transform:none;}
  html.phone .screen>.grid,html.phone .screen>.scrollind,html.phone .screen>.conn{grid-row:1;}
  html.phone .screen>.grid{margin:calc(env(safe-area-inset-top,0px) + 10px) 10px 6px;padding:10px;border-radius:30px;}
  html.phone .screen>.tabs{grid-row:2;margin:4px 10px calc(env(safe-area-inset-bottom,0px) + 8px);}
  html.phone .screen.split #playerpane,html.phone .screen.split #frontpane{display:none;}
  html.phone .screen.split #grid{grid-column:1;}
  html.phone .saver.layout .sv-bar{top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;right:10px;}
  /* Detailansicht: Kachel-Listen (Szenen, Mitglieder) nicht auf Handyhoehe strecken */
  html.phone .grid.panel .scenes{grid-auto-rows:minmax(76px,112px);align-content:start;}
  html.phone .saver.layout .sv-grid{inset:calc(env(safe-area-inset-top,0px) + 70px) 10px calc(env(safe-area-inset-bottom,0px) + 10px);padding:10px;border-radius:30px;}

  /* ==== Anordnung von Pillen (Designsystem 0.19.76) ====
     1. Fuge immer 10 px (space-gap), waagrecht wie senkrecht; Gruppe mittig.
     2. Hauptaktionen (Pille L, 56 px) gleich breit: eine = 61,8 % (goldener Schnitt),
        zwei = volle Breite je Haelfte, ab drei gleichmaessig, Umbruch in Reihen zu max. 3,
        letzte Reihe mittig.
     3. Nebenaktionen (Verlauf, Verknuepft, Quellen) sind zweitrangig: immer am Ende
        (rechts), Pille M (44 px), nur Umriss, nie "aktiv" gefuellt; Breite 1 : phi zur
        Hauptaktion. Ohne Hauptaktion rechtsbuendig, 38,2 % breit. */
  .brow.act{gap:10px;justify-content:center;align-items:center;}
  .brow.act.n1:not(.hasc) .btn{flex:0 0 61.8%;}
  .brow.act.n2:not(.hasc) .btn{flex:1 1 0;}
  .brow.wraprow{row-gap:10px;justify-content:center;}
  .brow.wraprow .btn{flex:0 1 calc((100% - 20px) / 3);}
  .brow.act .btn.cht{order:99;flex:1 1 0;height:var(--pill-m);background:transparent;color:var(--muted);
    box-shadow:inset 0 0 0 1.5px rgba(var(--wash,255,255,255),.3);font-size:13px;font-weight:600;}
  .brow.act .btn.cht.on{background:transparent;color:var(--ink);}
  .brow.act .btn.cht svg{width:20px;height:20px;}
  .brow.act.n0.hasc{justify-content:flex-end;}
  .brow.act.n0.hasc .btn.cht{flex:0 0 38.2%;}
  .brow.act.n1.hasc .btn:not(.cht){flex:0 0 50%;}   /* Hauptaktion behaelt mindestens die halbe Reihe */

  /* ==== Pruefung 0.19.77: Tippflaechen und Lesbarkeit ====
     Kleine Bedienelemente behalten ihre Optik, bekommen aber eine unsichtbare
     Tippflaeche von mindestens 44 px (WCAG / Apple HIG). */
  .updown .ub,.prevnext .ub,.campill{position:relative;}
  .updown .ub::after,.prevnext .ub::after,.campill::after{content:"";position:absolute;inset:-7px;}
  .tswitch::after{content:"";position:absolute;inset:-11px -4px;}
  /* Handy und 2x2-Raster: Kachelname zweizeilig statt nach einer Zeile abgeschnitten */
  .grid.cells.g2 .svw[data-sz="1x1"] .tile .name,
  html.phone .screen>.grid:not(.panel):not(.list):not(.scheme) .tile .name{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden;}

  /* Kamera "ganzes Bild": freie Raender fuellen (Config -> Kameras -> Bildausschnitt) */
  .camfill-card{background:var(--face,var(--tile)) linear-gradient(rgba(31,36,64,.07),rgba(31,36,64,.07)) !important;}
  .camfill-card .campill:not(.on){background:rgba(31,36,64,.38);border-color:transparent;}
  .camfill-blur{background:#2a2e3a !important;isolation:isolate;}
  .camfill-blur>canvas.camblur{position:absolute;inset:-6%;width:112%;height:112%;z-index:-1;pointer-events:none;
    filter:brightness(.82) saturate(1.1);image-rendering:auto;}

  /* ==== Nebenaktionen nur als Symbol (0.19.78) ====
     Verlauf, Verknuepft, Erzwingen, Quellen: Kreis 32 px mit Umriss, Tippflaeche 44 px,
     immer rechts am Ende; die Hauptaktionen teilen sich den Rest. */
  .brow.act .btn.cht,.brow.act.n0.hasc .btn.cht{order:99;flex:0 0 32px;width:32px;height:32px;min-width:32px;padding:0;
    border-radius:50%;position:relative;display:grid;place-items:center;}
  .brow.act .btn.cht::after{content:"";position:absolute;inset:-6px;}
  .brow.act .btn.cht svg{width:18px;height:18px;}
  .brow.act.hasc .btn:not(.cht){flex:1 1 0;}
  .brow.act.n1.hasc .btn:not(.cht){flex:0 1 61.8%;margin-right:auto;margin-left:auto;}
  /* ==== Einträge in Detailansichten als Listenzeilen (Zonen, Wecker, Stimmungen …) ====
     Schmal eine Spalte, breit (2 Panels/Tablet) zwei gleich breite Spalten ueber die
     ganze Breite; nie seitwaerts scrollen, nur senkrecht. */
  .pantop>.pbig ~ .scenes{grid-template-columns:minmax(0,1fr);grid-auto-rows:46px;align-content:start;
    overflow-x:hidden;overflow-y:auto;gap:8px;}
  .grid.panel.wide .pantop>.pbig ~ .scenes{grid-template-columns:repeat(2,minmax(0,1fr));}
  html.sqbig .pantop>.pbig ~ .scenes{grid-auto-rows:52px;}
  .pantop>.pbig ~ .scenes .scene{min-width:0;height:auto;padding:0 14px;gap:10px;border-radius:var(--r-m);}
  .pantop>.pbig ~ .scenes .scene .stx{min-width:0;flex:1 1 auto;}
  .pantop>.pbig ~ .scenes .scene b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pantop>.pbig ~ .scenes .scene .ssub{font-size:12px;}
  .pantop>.pbig ~ .scenes .sico svg{width:22px;height:22px;}

  /* ==== Anzeige statt Bedienung (0.19.80) ====
     Eintraege ohne Befehl (.ro) sehen nicht tippbar aus: keine Flaeche, nur eine
     Haarlinie; der Zustand "laeuft/aktiv" wird mit einem Indikator (abgerundetes
     Quadrat in dot-Farbe) und fetter Zeile gezeigt - nie mit der gefuellten
     ink-Flaeche, die Bedienelementen vorbehalten ist. */
  .pantop>.pbig ~ .scenes .scene.ro{background:transparent;box-shadow:inset 0 0 0 1px rgba(var(--wash,255,255,255),.14);
    color:var(--ink);cursor:default;}
  .pantop>.pbig ~ .scenes .scene.ro:active{transform:none;opacity:1;}
  .pantop>.pbig ~ .scenes .scene.ro .sico{color:var(--muted);}
  .pantop>.pbig ~ .scenes .scene.ro.on{background:rgba(var(--wash,255,255,255),.06);color:var(--ink);}
  .pantop>.pbig ~ .scenes .scene.ro.on .sico{color:var(--dot,var(--accent));}
  .pantop>.pbig ~ .scenes .scene.ro.on b::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;
    vertical-align:2px;border-radius:var(--r-round,32%);background:var(--dot,var(--accent));}
  .pantop>.pbig ~ .scenes .scene.ro.on .ssub{opacity:1;color:var(--muted);}
  /* Eintrag oeffnet eine Ansicht: Pfeil rechts wie bei Kacheln */
  .pantop>.pbig ~ .scenes .scene.nav::after{content:"\203A";margin-left:auto;padding-left:8px;font-size:22px;line-height:1;opacity:.55;}

  /* ==== Flaeche heisst tippbar (0.19.80) ====
     Alles Tippbare hat eine Flaeche; Rang ueber Groesse und Deckkraft:
     Haupt = tile deckend, Neben (Kreis 32 px) und Chips = tile 55 %, ohne Umriss.
     Nur reine Anzeigen sind durchsichtig mit Haarlinie (.scene.ro). */
  .brow.act .btn.cht,.chrng .chip{box-shadow:none;border-color:transparent;color:var(--ink);
    background:rgba(var(--wash,255,255,255),.12);background:color-mix(in srgb,var(--tile) 55%,transparent);}
  .chrng .chip.on{background:var(--ink);color:var(--tile);}

  /* ==== Ebene 1: Rasterzellen immer quadratisch (0.19.81) ====
     Panels/Tablet sind es durch das 160er-Raster; auf dem Handy kam die Zeilenhoehe
     bisher aus der Bildschirmhoehe (4 Zeilen je Bild) und die Kacheln wurden je nach
     Geraet hoch oder flach. Jetzt: Zeilenhoehe = Spaltenbreite (Rand 10 + Innenabstand 10
     je Seite), gescrollt wird senkrecht. 2x1 = 2:1, 2x2 = 1:1 inkl. Fuge. */
  html.phone .grid.cells,
  html.phone .screen>.grid:not(.panel):not(.list):not(.scheme){grid-auto-rows:calc((100vw - 40px - (var(--cc,2) - 1) * var(--gap,10px)) / var(--cc,2));}

  /* ==== 2b einheitlich (0.19.82) ====
     Alle Eintraege einer Detailansicht (Stimmungen, Zonen, Wecker ...) sind Listenzeilen:
     46 px (Tablet 52), eine Spalte bis 4 Eintraege, ab 5 Eintraegen oder breit zwei
     gleich breite Spalten. Aktionsreihe breit hoechstens 640 px, mittig. */
  .grid.panel .pantop>.scenes{grid-template-columns:minmax(0,1fr);grid-auto-rows:46px;align-content:start;
    overflow-x:hidden;overflow-y:auto;gap:8px;}
  .grid.panel .pantop>.scenes:has(>:nth-child(5)),.grid.panel.wide .pantop>.scenes{grid-template-columns:repeat(2,minmax(0,1fr));}
  html.sqbig .grid.panel .pantop>.scenes{grid-auto-rows:52px;}
  html.phone .grid.panel .pantop>.scenes{grid-auto-rows:46px;align-content:start;grid-template-columns:minmax(0,1fr);}   /* Handy: Hoehe reicht, eine Spalte */
  .grid.panel .pantop>.scenes>.scene{flex-direction:row;align-items:center;justify-content:flex-start;min-width:0;height:auto;
    padding:0 14px;gap:10px;border-radius:var(--r-m);}
  .grid.panel .pantop>.scenes>.scene .stx{min-width:0;flex:1 1 auto;}
  .grid.panel .pantop>.scenes>.scene b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .grid.panel .pantop>.scenes>.scene .ssub{font-size:12px;}
  .grid.panel .pantop>.scenes .sico{flex:none;display:grid;place-items:center;}
  .grid.panel .pantop>.scenes .sico svg{width:22px;height:22px;margin:0;}
  .grid.panel.wide .brow.act{width:100%;max-width:640px;margin-left:auto;margin-right:auto;}
  /* Zustandsflaeche: Statuswoerter (Alarm, Keine Eintraege ...) ruhiger als Messwerte */
  .dstate .pbig{font-size:clamp(28px,8vw,44px);letter-spacing:-.02em;}

  /* Wetter-Info: gewaehlter Chip wie jede aktive Bedienung (ink gefuellt); reine Info-Chips als Anzeige */
  .wxc.on{box-shadow:none;background:var(--ink);color:var(--tile);}
  .wxc.on span{color:var(--tile);opacity:.75;}
  .wxc:not(.wxsel){background:transparent;box-shadow:inset 0 0 0 1px rgba(var(--wash,31,36,64),.16);}

  /* Wetter-Info: Tag wechseln (Pfeile = Nebenaktionen, Punkte = Indikatoren) */
  .wxnav{display:flex;align-items:center;gap:10px;}
  .wxar{position:relative;width:32px;height:32px;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink);
    background:rgba(255,255,255,.55);background:color-mix(in srgb,var(--tile) 55%,transparent);}
  .wxar::after{content:"";position:absolute;inset:-6px;}
  .wxar svg{width:16px;height:16px;} .wxar:disabled{opacity:.3;cursor:default;}
  .wxdots{display:flex;gap:6px;margin:0 auto;}
  .wxdots i{width:7px;height:7px;border-radius:var(--r-round,32%);background:rgba(var(--wash,31,36,64),.25);}
  .wxdots i.on{background:var(--ink);}

  /* Kleine Kacheln im 3x3-Raster (z. B. Shelly X2i): Auf/Ab nebeneinander wie Zurueck/Vor,
     sonst wird der Kopf so hoch, dass die Zustandszeile ("52 % zu") abgeschnitten wird. */
  .grid.cells.g3 .svw[data-sz="1x1"] .updown,.grid.cells.g3 .svw[data-sz="2x1"] .updown{flex-direction:row;gap:6px;}

  /* Schwache Panels (Shelly): keine Glas-Unschaerfe - backdrop-filter rechnet bei jeder
     Aenderung darunter neu; stattdessen etwas dichtere Flaeche. */
  html.lite *{-webkit-backdrop-filter:none !important;backdrop-filter:none !important;}
  html.lite .video .vrow .btn,html.lite .video .vhead{opacity:.94;}
  /* Kamera-Overlays ohne Glas-Unschaerfe: backdrop-filter wird bei JEDEM Kamerabild
     neu berechnet - auf schwachen Panels (Shelly) eine Dauerlast. Dunklerer Grund statt Blur. */
  .campill,.camlbl,.icab{-webkit-backdrop-filter:none !important;backdrop-filter:none !important;}
  .campill{background:rgba(0,0,0,.42);} .camlbl{background:rgba(0,0,0,.5);} .icab{background:rgba(0,0,0,.5);}
</style>
</head>
<body>
<!-- Statisches <audio> fuer den eigenen Klingelton (Settings -> Kamera/
     Tuerstation -> Upload). BEWUSST fest im Markup (nicht per new Audio()
     erzeugt) und ausserhalb jedes ein-/ausblendbaren Bereichs, da ein Klingeln
     auf jeder Ansicht passieren kann, nicht nur im Screensaver: manche Kiosk-
     Browser/WebViews (u.a. Fully Kiosk Browser, wie z.B. auf einem Shelly
     Wall Display eingesetzt) erlauben Autoplay fuer <audio> laut eigener Doku
     NUR bei einem "statischen" Tag im Markup, nicht bei dynamisch per JS
     erzeugten Audio-Objekten. preload "none" spart auf schwacher Hardware
     Speicher, bis wirklich geklingelt wird. -->
<audio id="ringAudio" preload="none" loop playsinline></audio>
<div class="screen">
  <div class="conn" id="conn"></div>
  <div class="playerpane" id="playerpane"></div>

// ---- Weckton (Loxone-Wecker klingelt / Intercom-Klingel) ----
// Synthetischer Piep-Loop per Web Audio API: kein Audio-Asset noetig, laeuft bis
// der Server das Ende meldet ({t:'alarm',on:false}, nach 'dismiss' in Loxone/App
// oder ueber den "Wecker aus"-Button am Panel; bzw. {t:'ring',on:false,sound:true},
// sobald der bell-Impuls am Miniserver endet). Der Kiosk startet Chromium mit
// --autoplay-policy=no-user-gesture-required, darum spielt der Ton ohne vorherige
// Nutzergeste. Zusaetzlich ein Failsafe, der nach 5 Min stoppt, falls das
// Aus-Event mal ausbleibt (sonst piepte das Panel endlos).
let _actx=null, _alarmTimer=null, _alarmFailsafe=null;
// Ton fuer Wecker/Klingel/Alarm - so gebaut, dass er auch auf Tablets,
// NSPanel & Co. (Android-WebView, Kiosk-Apps, Safari) zuverlaessig spielt:
//  1. Browser geben Audio erst nach einer Beruehrung frei. Darum wird beim
//     ERSTEN Antippen des Panels der Ton vorab freigeschaltet (WebAudio +
//     <audio>-Element, beides stumm angespielt) - Wandpanels werden ohnehin
//     regelmaessig beruehrt, danach darf das Panel jederzeit von selbst piepen.
//  2. Weg A: erzeugter Piepton per WebAudio (keine Datei noetig).
//     Weg B, falls WebAudio gesperrt/nicht da: derselbe Piepton als kleine
//     WAV (im Browser erzeugt) in einem <audio>-Element in Schleife.
//  3. Ist beides gesperrt, zeigt das Panel "Ton antippen" - die naechste
//     Beruehrung startet den Ton sofort.
let _toneEl=null, _toneBlocked=false;
function _beepWavUrl(){
  // 0,7 s Zyklus: 0,4 s Rechteck 880 Hz (leicht ein-/ausgeblendet), Rest Stille; 8 kHz 8 bit mono
  const sr=8000, n=Math.round(sr*0.7), on=Math.round(sr*0.4), b=new Uint8Array(44+n), dv=new DataView(b.buffer);
  const w=(o,t)=>{ for(let i=0;i<t.length;i++) b[o+i]=t.charCodeAt(i); };
  w(0,'RIFF'); dv.setUint32(4,36+n,true); w(8,'WAVEfmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true);
  dv.setUint16(22,1,true); dv.setUint32(24,sr,true); dv.setUint32(28,sr,true); dv.setUint16(32,1,true);
  dv.setUint16(34,8,true); w(36,'data'); dv.setUint32(40,n,true);
  for(let i=0;i<n;i++){ let v=0; if(i<on){ const env=Math.min(1,i/80,(on-i)/400); v=((Math.floor(i*880*2/sr)%2)?1:-1)*0.6*env; }
    b[44+i]=Math.round(128+v*127); }
  let bin=''; for(let i=0;i<b.length;i++) bin+=String.fromCharCode(b[i]);
  return 'data:audio/wav;base64,'+btoa(bin);
}
function _toneElGet(){
  if(!_toneEl){ try{ _toneEl=new Audio(_beepWavUrl()); _toneEl.loop=true; _toneEl.preload='auto'; }catch(e){ _toneEl=null; } }
  return _toneEl;
}
function _actxGet(){
  try{ _actx=_actx||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ _actx=null; }
  return _actx;
}
// Bei jeder Beruehrung (billig): Audio freischalten bzw. gesperrten Ton nachholen
function audioUnlock(){
  const a=_actxGet();
  if(a&&a.state!=='running'){ try{ a.resume(); const bf=a.createBuffer(1,1,22050), s=a.createBufferSource(); s.buffer=bf; s.connect(a.destination); s.start(0); }catch(e){} }
  const el2=_toneElGet();
  if(el2&&!el2._unlocked&&!_alarmTimer){ el2.muted=true;
    const p=el2.play(); const done=()=>{ el2.pause(); el2.currentTime=0; el2.muted=false; };
    if(p&&p.then) p.then(()=>{ el2._unlocked=true; done(); }).catch(done); else done(); }
  if(_toneBlocked&&_toneSources.size){ _toneBlocked=false; document.documentElement.classList.remove('tone-blocked'); _alarmTimer=null; startAlarmTone(); }
}
['pointerdown','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,audioUnlock,{capture:true,passive:true}));
function startAlarmTone(){
  if(_alarmTimer) return;               // laeuft schon
  const blocked=()=>{ _toneBlocked=true; document.documentElement.classList.add('tone-blocked'); };
  const viaEl=()=>{ const e=_toneElGet(); if(!e){ blocked(); return; }
    e.muted=false; e.currentTime=0; const p=e.play();
    if(p&&p.catch) p.catch(blocked); };
  const viaCtx=()=>{
    const beep=()=>{
      if(_actx.state!=='running'){ _actx.resume(); return; }
      const t=_actx.currentTime, o=_actx.createOscillator(), g=_actx.createGain();
      o.type='square'; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.35,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
      o.connect(g); g.connect(_actx.destination);
      o.start(t); o.stop(t+0.45);
    };
    beep(); _alarmTimer=setInterval(beep,700);
  };
  _alarmTimer=-1;                       // Merker "Ton gewuenscht" (auch fuer Weg B)
  const a=_actxGet();
  if(a&&a.state==='running'){ _alarmTimer=null; viaCtx(); }
  else if(a){ Promise.race([a.resume(), new Promise(r=>setTimeout(r,400))]).then(()=>{
      if(_alarmTimer!==-1) return;      // inzwischen gestoppt
      if(a.state==='running'){ _alarmTimer=null; viaCtx(); } else viaEl(); }).catch(viaEl); }
  else viaEl();
  clearTimeout(_alarmFailsafe);
  _alarmFailsafe=setTimeout(stopAlarmTone,5*60*1000);
}
function stopAlarmTone(){
  _toneSources.clear();   // "Ton aus" ist immer vollstaendig - auch beim Failsafe (unten) synchron halten
  if(_alarmTimer&&_alarmTimer!==-1) clearInterval(_alarmTimer);
  _alarmTimer=null; _toneBlocked=false; document.documentElement.classList.remove('tone-blocked');
  if(_toneEl&&!_toneEl.paused){ _toneEl.pause(); _toneEl.currentTime=0; }
  clearTimeout(_alarmFailsafe); _alarmFailsafe=null;
}
// Mehrere Quellen koennen gleichzeitig einen Ton wollen (Wecker UND Klingel).
// startAlarmTone()/stopAlarmTone() steuern nur die Hardware (den Oszillator);
// hier wird gezaehlt, WER gerade Ton will, damit z.B. eine endende Klingel
// nicht versehentlich einen noch laufenden Weckton abwuergt (und umgekehrt).
let _toneSources=new Set();
function toneOn(src){ _toneSources.add(src); startAlarmTone(); }
function toneOff(src){ _toneSources.delete(src); if(!_toneSources.size) stopAlarmTone(); }
// ---- Eigener Klingelton (Upload je Intercom, s. Settings) ----
// Laeuft als Endlosschleife, solange der bell-Impuls ansteht (wie der
// synthetische Ton), plus eigenem 5-Min-Failsafe fuer den Fall, dass das
// Aus-Event mal ausbleibt. Nutzt das statische <audio id="ringAudio"> aus dem
// Markup (siehe Kommentar dort) - falls Autoplay dafuer trotzdem blockiert
// ist (play() liefert eine abgelehnte Promise), faellt automatisch auf den
// synthetischen Wecker-Ton zurueck, statt komplett stumm zu bleiben.
let _ringFailsafe=null;
function playRingAudio(url){
  const a=el('ringAudio');
  if(!a){ toneOn('ring'); return; }   // Markup fehlt aus irgendeinem Grund -> wenigstens Synth-Ton
  if(a.getAttribute('src')!==url) a.src=url;
  a.currentTime=0;
  const p=a.play();
  if(p && p.catch) p.catch(()=>{ toneOn('ring'); });   // Autoplay blockiert -> Fallback auf Synth-Ton
  clearTimeout(_ringFailsafe);
  _ringFailsafe=setTimeout(stopRingAudio,5*60*1000);
}
function stopRingAudio(){
  clearTimeout(_ringFailsafe); _ringFailsafe=null;
  const a=el('ringAudio'); if(a){ a.pause(); a.currentTime=0; }
  toneOff('ring');   // raeumt auch den Fallback-Synth-Ton (falls aktiv) sauber ab
}
// Sichtbarer Hinweis oben am Panel — bestaetigt, dass ein Test-Ton-Event
// tatsaechlich ankam, und meldet den AudioContext-Status. So laesst sich
// "Push kommt nicht an" von "Audio-Ausgabe stumm" trennen.
function flashAudioBadge(txt, ok){
  let b=document.getElementById('audiobadge');
  if(!b){
    b=document.createElement('div'); b.id='audiobadge';
    b.style.cssText='position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99999;'+
      'padding:13px 20px;border-radius:var(--r-m);font:600 15px system-ui,sans-serif;color:#fff;'+
      'box-shadow:0 8px 28px rgba(0,0,0,.45);pointer-events:none;opacity:0;transition:opacity .3s;max-width:90vw;text-align:center;';
    document.body.appendChild(b);
  }
  b.textContent=txt;
  b.style.background = ok ? 'rgba(82,184,129,.96)' : 'rgba(226,107,95,.96)';
  b.style.opacity='1';
  clearTimeout(b._t); b._t=setTimeout(()=>{ b.style.opacity='0'; }, 3500);
}
// Kurzer Test-Ton (3 Pieptoene) von der Einstellungen-Seite ausgeloest. Eigener
// AudioContext (stoert einen evtl. laufenden echten Weckton nicht). resume()
// wird abgewartet, damit der Ton auch bei anfangs suspendiertem Context spielt;
// der Badge meldet, ob der Context wirklich laeuft.
function playTestTone(){
  let actx;
  try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }
  catch(e){ flashAudioBadge('🔊 Test-Ton empfangen — Web Audio nicht verfügbar', false); return; }
  const boom=()=>{
    try{
      let t=actx.currentTime;
      for(let i=0;i<3;i++){
        const o=actx.createOscillator(), g=actx.createGain();
        o.type='square'; o.frequency.value=880;
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.4,t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
        o.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t+0.4); t+=0.5;
      }
    }catch(e){}
    const running = actx.state==='running';

// ---- Zoom-Uebergang Kachel <-> Detail (UI-Mockup) ----
// Leichtgewichtig fuer schwache Panels (Shelly): Es wird KEINE Kopie der Seite
// und keine clip-path-Maske animiert (beides zeichnet der Browser jedes Bild
// neu), sondern EINE einfarbige Flaeche in Kachelfarbe, und zwar nur ueber
// transform und opacity - das erledigt der Grafikprozessor ohne Neuzeichnen.
// Oeffnen: Flaeche waechst aus der angetippten Kachel auf die volle Karte,
// darunter steht die neue Seite schon bereit und erscheint, wenn die Flaeche
// ausblendet. Zurueck: Flaeche deckt die Karte ab und schrumpft auf die
// Ursprungs-Kachel, waehrenddessen erscheint die Kachelseite darunter.
let _zoomPending=null;        // Kachel-Rechteck bis die neue Seite gezeichnet ist
const _zoomRects=[];          // je Stapel-Ebene: Rechteck der Kachel, aus der sie geoeffnet wurde
function zoomOn(){ return (document.documentElement.dataset.motion||'full')==='full' && getComputedStyle(document.documentElement).getPropertyValue('--anim-scale').trim()!=='0'; }
// Flaeche ueber der Karte; tr() liefert das transform fuer ein Kachel-Rechteck.
function zoomGhost(g){
  // Rechtecke kommen in Bildschirm-Pixeln; die Flaeche liegt im gezoomten
  // Kasten (.screen, scale k auf Tablets) -> Positionen und Groessen durch k.
  const sc=g.parentNode, gb=g.getBoundingClientRect(), sb=sc.getBoundingClientRect(), k=uiScaleEff||1;
  const gh=document.createElement('div'); gh.className='zghost';
  gh.style.gridArea='auto';   // Bezug = Kastenrand (nicht der Grid-Bereich hinter dem Innenabstand)
  gh.style.left=((gb.left-sb.left)/k)+'px'; gh.style.top=((gb.top-sb.top)/k)+'px';
  gh.style.width=(gb.width/k)+'px'; gh.style.height=(gb.height/k)+'px';
  sc.appendChild(gh);
  gh.tr=r=>'translate('+((r.left-gb.left)/k)+'px,'+((r.top-gb.top)/k)+'px) scale('+
    ((r.right-r.left)/gb.width)+','+((r.bottom-r.top)/gb.height)+')';
  return gh;
}
function zoomFrom(tile){
  if(!zoomOn()||!tile) return;

}
function zoomOpen(){
  const z=_zoomPending; _zoomPending=null;
  if(!z||Date.now()-z.t>4000||stack.length!==z.lvl+1) return;
  _zoomRects[z.lvl]=z.r;
  const g=el('grid'), gh=zoomGhost(g);
  g.classList.add('zhide');   // neue Seite erst zeigen, wenn die Flaeche die Karte deckt
  gh.style.transform=gh.tr(z.r); gh.getBoundingClientRect();
  gh.classList.add('grow'); gh.style.transform='none';
  // Flaeche ist ganz aufgezogen -> Seite zeigen, Flaeche ausblenden
  setTimeout(()=>{ g.classList.remove('zhide'); gh.classList.add('fade'); setTimeout(()=>gh.remove(),200); }, 240);
}
function zoomBack(){
  const r=_zoomRects[stack.length-1]; _zoomRects.length=stack.length-1;
  if(!r||!zoomOn()) return;
  const g=el('grid'); if(!g.parentNode) return;
  const gh=zoomGhost(g);
  g.classList.add('zhide'); setTimeout(()=>g.classList.remove('zhide'),1200);   // bis die Kachelseite da ist
  gh.getBoundingClientRect();
  gh.classList.add('shrink'); gh.style.transform=gh.tr(r);
  setTimeout(()=>{ gh.classList.add('fade'); setTimeout(()=>gh.remove(),200); }, 260);

// Vom Dashboard aus geoeffnet: "Zurueck" fuehrt wieder zum Dashboard.

let _saverPrevStack=null;

function back(){

const SLD_STEP=5;   // Schrittweite der -/+ Tasten am Schieberegler (Lautstaerke etc.)

function sldFill(sld){ if(!sld)return;

function nudgeSld(sld,delta,valEl){ if(!sld)return;
  const min=+sld.min||0, max=(sld.max!==''?+sld.max:100);
  let v=+((+sld.value||0)+delta).toFixed(stellen(delta)); v=Math.max(min,Math.min(max,v));

  alarm:'alarm-1',gate:'gate-closed-1',thermo:'thermometer',fan:'fan-1',cam:'cc-camera',shield:'shield-2',drop:'water-drop',

  play:'control-play',pause:'control-pause',stop:'control-stop',prev:'control-previous',next:'control-next',
  chart:'graph-line-3',bolt:'flash-1'};   // 'list' bleibt eigenes Symbol: playlist-3 ist eine Musikliste
const LOXSVG_TAGS={path:1,circle:1,rect:1,line:1,polyline:1,polygon:1,ellipse:1,g:1};
const LOXSVG_ATTR={d:1,cx:1,cy:1,r:1,rx:1,ry:1,x:1,y:1,x1:1,y1:1,x2:1,y2:1,width:1,height:1,points:1,transform:1,
  'fill-rule':1,'clip-rule':1,'stroke-width':1,'stroke-linecap':1,'stroke-linejoin':1,'stroke-miterlimit':1,opacity:1};
function loxSvgClean(txt){
  const doc=new DOMParser().parseFromString(txt,'image/svg+xml'), root=doc.documentElement;
  if(!root||root.nodeName!=='svg') return null;
  // fill/stroke erben wie in SVG (Wurzel: fill schwarz, stroke keiner), dann einfaerben
  const walk=(el,pf,ps)=>{ let out=''; for(const c of el.children){ const t=c.nodeName; if(!LOXSVG_TAGS[t]) continue;
      let a=''; for(const at of c.attributes){ if(LOXSVG_ATTR[at.name]&&!/[<>"]|url\(/i.test(at.value)) a+=' '+at.name+'="'+at.value+'"'; }
      const f=c.getAttribute('fill')||pf, st=c.getAttribute('stroke')||ps;
      a+=' fill="'+(f!=='none'?'currentColor':'none')+'" stroke="'+(st!=='none'?'currentColor':'none')+'"';
      out+='<'+t+a+'>'+walk(c,f,st)+'</'+t+'>'; } return out; };
  const inner=walk(root,root.getAttribute('fill')||'black',root.getAttribute('stroke')||'none'); return inner.length>20&&inner.length<20000?inner:null;
}
async function loadLoxIcons(){
  let changed=false;
  await Promise.all(Object.entries(LOX_ICONS).map(async([k,n])=>{
    const key='loxi1:'+n; let inner=null;
    try{ inner=localStorage.getItem(key); }catch(e){}
    if(!inner){ try{ const r=await fetch('/icon?p=IconsFilled/'+n+'.svg'); if(r.ok){ inner=loxSvgClean(await r.text());
        if(inner){ try{ localStorage.setItem(key,inner); }catch(e){} } } }catch(e){} }
    if(inner){ ICONS[k]=inner; STROKE_ICONS[k]=1; changed=true; }
  }));
  if(changed&&typeof render==='function'){ try{ render(); }catch(e){} }
}

// Statistik-Dateien des Miniservers und kommen fertig aufbereitet vom Server.
// Zeitstempel sind Wanduhr-Sekunden der Anlage, als UTC gefuehrt: mit getUTC*
// formatiert zeigt jedes Panel dieselbe Uhrzeit wie der Miniserver, egal in

function chTime(t,span){ const d=new Date(t*1000), p=n=>String(n).padStart(2,'0');

  return h ? h+' h'+(m?' '+m+' min':'') : m+' min'; }

// hoechstens 5 Beschriftungen ergibt (24 h -> alle 6 h, 7 Tage -> jeden 2. Tag,
// 30 Tage -> woechentlich). Die Sekunden sind Wanduhrzeit, t % Tag = 0 ist also
// Mitternacht; Wochen beginnen am Montag (der 1.1.1970 war ein Donnerstag).

    const off=st===7*D?4*D:0, first=Math.ceil((t0-off)/st)*st+off;
    if(Math.floor((t1-first)/st)+1<=5){ const out=[]; for(let t=first;t<=t1;t+=st) out.push(t); return {ticks:out, day:st>=D}; }
  }

      const line=p.map(([t,v])=>f(X(t))+','+f(Y(v))).join(' ');
      if(si===0) s+='<polygon points="'+f(X(p[0][0]))+','+f(Y(mn))+' '+line+' '+f(X(p[p.length-1][0]))+','+f(Y(mn))+'" fill="url(#'+id+')"/>';

      info='min <b>'+chNum(Math.min(...vs),se.dec)+'</b> · max <b>'+chNum(Math.max(...vs),se.dec)+unit+'</b>';
    }
    leg.push('<span><span class="chdot" style="background:'+col+'"></span>'+esc(se.name)+' · '+info+'</span>');
  });
  body.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+s+'</svg><div class="chleg">'+leg.join('')+'</div>';
