// Mini-Verlauf in einer Kachel (it.spark, je Kachel im Konfigurator gewaehlt). Drei
// Stile, gezeichnet in der echten Pixelgroesse der freien Kachelmitte (paintSpark),
// damit Beschriftungen scharf und unverzerrt bleiben:
//   trend    Verlauf: Linie mit Tiefst-/Hoechstwert und Jetzt-Punkt, Digitalwert
//            als Stufen, Zaehlerstand als Verbrauchsbalken
//   pattern  Tagesmuster: 7 Tage (Zeilen, heute unten) x 24 Stunden, Deckkraft = Wert
//   span     Tagesspanne: je Tag ein Balken Tiefst- bis Hoechstwert, Strich = Mittel
// Ein Farbton (Akzent) fuer alle Werte, Beschriftung in der Textfarbe (--muted).
function sparkSvg(sp,W,H){
  if(!sp || sp.state!=='ok' || W<24 || H<18) return '';
  const f=n=>n.toFixed(1), dec=sp.dec||0, acc='var(--accent)';
  const txt=(x,y,t,anc,extra)=>'<text class="mm" x="'+f(x)+'" y="'+f(y)+'" text-anchor="'+(anc||'middle')+'"'+(extra||'')+'>'+esc(t)+'</text>';
  let s='';
  if(sp.style==='pattern'){
    const c=sp.cells||[], vs=c.filter(v=>v!=null); if(!vs.length) return '';
    let mn=sp.kind==='line'?Math.min(...vs):0, mx=Math.max(...vs); if(mx-mn<1e-9) mx=mn+1;
    const lab=H>=58?11:0, gap=W<150?.75:1.5, cw=(W-23*gap)/24, ch=Math.max(2,(H-lab-6*gap)/7);
    c.forEach((v,i)=>{ const d=Math.floor(i/24), h=i%24, x=h*(cw+gap), y=d*(ch+gap);
      s+= v==null
        ? '<rect x="'+f(x+.5)+'" y="'+f(y+.5)+'" width="'+f(cw-1)+'" height="'+f(ch-1)+'" rx="1.5" style="fill:none;stroke:var(--line)"/>'
        : '<rect x="'+f(x)+'" y="'+f(y)+'" width="'+f(cw)+'" height="'+f(ch)+'" rx="1.5" style="fill:'+acc+';opacity:'+(0.08+0.92*(v-mn)/(mx-mn)).toFixed(3)+'"/>'; });
    if(lab){ const y=H-1; s+=txt(0,y,'0 h','start')+txt(12*(cw+gap)-gap/2,y,'12 h')+txt(W,y,'24 h','end'); }
  } else if(sp.style==='span'){
    const sp7=sp.spans||[], ok=sp7.filter(Boolean); if(!ok.length) return '';
    let mn=Math.min(...ok.map(r=>r[0])), mx=Math.max(...ok.map(r=>r[1])); if(mx-mn<1e-9){ mn-=1; mx+=1; }
    const n=sp7.length, col=W/n, lab=(H>=48 && col>=16)?11:0, bw=Math.min(16,col*0.58), top=2, bot=H-lab-2;
    const Y=v=>bot-(v-mn)*(bot-top)/(mx-mn);
    sp7.forEach((r,i)=>{ const x=i*col+(col-bw)/2, today=i===n-1;
      if(r){ const y1=Y(r[1]), y0=Y(r[0]);
        s+='<rect x="'+f(x)+'" y="'+f(y1)+'" width="'+f(bw)+'" height="'+f(Math.max(3,y0-y1))+'" rx="'+f(Math.min(4,bw/2))+'" style="fill:'+acc+';opacity:'+(today?1:.3)+'"/>';
        if(r[2]!=null) s+='<line x1="'+f(x+2)+'" x2="'+f(x+bw-2)+'" y1="'+f(Y(r[2]))+'" y2="'+f(Y(r[2]))+'" style="stroke:'+(today?'var(--tile)':'var(--ink)')+';stroke-width:1.5;opacity:.75"/>'; }
      if(lab) s+=txt(i*col+col/2,H-1,(sp.days||[])[i]||'','middle',today?' style="fill:var(--ink);font-weight:600"':''); });
  } else {
    const p=sp.pts||[]; if(!p.length) return '';
    const t0=sp.t0, t1=sp.t1, span=Math.max(1,t1-t0), ln=sp.kind==='line';
    const vs=p.map(q=>q[1]); let mn=Math.min(...vs), mx=Math.max(...vs);
    if(sp.lo) mn=Math.min(mn,sp.lo[1]); if(sp.hi) mx=Math.max(mx,sp.hi[1]);
    if(!ln) mn=Math.min(0,mn); if(mx-mn<1e-9) mx=mn+1;
    const labs=ln&&H>=48, pt=labs?13:6, pb=labs?13:6, pl=ln?4:0, pr=ln?6:0;
    const X=t=>pl+(t-t0)*(W-pl-pr)/span, Y=v=>H-pb-(v-mn)*(H-pt-pb)/(mx-mn);
    if(sp.kind==='counter'){
      p.forEach(([t,v],i)=>{ const x=X(t), w=Math.max(1,(i+1<p.length?X(p[i+1][0]):W)-x-1.5), y=Y(v);
        s+='<rect x="'+f(x)+'" y="'+f(y)+'" width="'+f(w)+'" height="'+f(Math.max(0,Y(0)-y))+'" rx="1.5" style="fill:'+acc+';opacity:.85"/>'; });
    } else if(sp.kind==='digital'){
      let d='M'+f(X(p[0][0]))+' '+f(Y(p[0][1]));
      p.forEach(([t,v],i)=>{ const tn=i+1<p.length?p[i+1][0]:t1; d+=' H'+f(X(tn))+(i+1<p.length?' V'+f(Y(p[i+1][1])):''); });
      s='<path d="'+d+' V'+f(Y(0))+' H'+f(X(p[0][0]))+' Z" style="fill:'+acc+';opacity:.22"/>'+
        '<path d="'+d+'" style="fill:none;stroke:'+acc+';stroke-width:2"/>';
    } else {
      const line=p.map(([t,v])=>f(X(t))+','+f(Y(v))).join(' ');
      s='<polygon points="'+f(X(p[0][0]))+','+f(H)+' '+line+' '+f(X(p[p.length-1][0]))+','+f(H)+'" style="fill:'+acc+';opacity:.12"/>'+
        '<polyline points="'+line+'" style="fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round"/>';
      const mark=(q,above)=>{ const x=X(q[0]), y=Y(q[1]), a=x<18?'start':(x>W-18?'end':'middle');
        return '<circle cx="'+f(x)+'" cy="'+f(y)+'" r="3" style="fill:var(--tile);stroke:var(--ink);stroke-width:1.4"/>'+
               (labs?txt(x,above?y-5.5:y+12,chNum(q[1],dec),a):''); };
      if(sp.hi) s+=mark(sp.hi,true);
      if(sp.lo && (!sp.hi || sp.lo[0]!==sp.hi[0])) s+=mark(sp.lo,false);
      const q=p[p.length-1];
      s+='<circle cx="'+f(X(q[0]))+'" cy="'+f(Y(q[1]))+'" r="4.5" style="fill:'+acc+';stroke:var(--tile);stroke-width:2"/>';
    }
  }
  return '<svg viewBox="0 0 '+f(W)+' '+f(H)+'" width="'+f(W)+'" height="'+f(H)+'" aria-hidden="true">'+s+'</svg>';
}
// Mini-Verlauf in seinen Platz zeichnen; nur neu, wenn sich Daten oder Groesse aendern.
const SPARK_MIN_H=36;   // px: niedrigere Mitte -> Verlauf in die Kopfzeile (enge Kachel)
function paintSpark(el,sp){
  if(!el) return;
  const tile=el.closest('.tile');
  placeSpark(el,sp,tile);
  // Angabe im Kopf abgeschnitten -> in die Raumzeile (nur ohne enge Kachel, dort steht sie ohnehin da).
  // Ohne Raumzeile kommt die Zeile dabei neu dazu oder faellt weg: dann hat
  // die Mitte eine andere Hoehe, Platz und Zeichnung also neu bestimmen.
  const bd=tile&&tile.querySelector('.tsbadge');
  if(bd){
    const vorher=tile.classList.contains('sparkbadge');
    tile.classList.remove('sparkbadge');
    if(!tile.classList.contains('sparktight') && bd.scrollWidth>bd.clientWidth+1) tile.classList.add('sparkbadge');
    if(vorher!==tile.classList.contains('sparkbadge')) placeSpark(el,sp,tile);
  }
}
// Verlauf in die Mitte oder (zu niedrige Mitte) in die Kopfzeile setzen und zeichnen.
function placeSpark(el,sp,tile){
  const head=tile&&tile.querySelector('.head');
  if(head){
    // Freie Mitte = Innenhoehe der Kachel minus alles ausser dem Verlauf (und seinem Rand)
    const cs=getComputedStyle(tile);
    let free=tile.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-10;
    for(const ch of tile.children) if(ch!==el) free-=ch.offsetHeight;
    const tight=free<SPARK_MIN_H;
    if(tight!==tile.classList.contains('sparktight') || tight!==(el.parentNode===head)){
      tile.classList.toggle('sparktight',tight);
      if(tight) head.insertBefore(el,head.firstElementChild.nextSibling);
      else tile.insertBefore(el,head.nextSibling);
      el.innerHTML=''; el._key=null;
    }
  }
  const W=el.clientWidth, H=el.clientHeight, key=W+'x'+H+JSON.stringify(sp);
  if(el._key!==key){ el._key=key; el.innerHTML=sparkSvg(sp,W,H); }
}

    sld.addEventListener('input',()=>{ sldDragging=true; sldFill(sld); const sv=g.querySelector('.sval'); if(sv)sv.textContent=sld.value; });
    sld.addEventListener('change',()=>{ sldDragging=false; send({t:'cmd',uuid:sld._uuid,cmd:sld._tmpl.replace('{v}',sld.value)}); });
    const sdn=g.querySelector('.srow .sbtn[data-sd="dn"]'), sup=g.querySelector('.srow .sbtn[data-sd="up"]');
    const step=(sb.step&&+sb.step>0)?+sb.step:SLD_STEP;
    if(sdn) sdn.addEventListener('pointerdown',ev=>{ ev.preventDefault(); nudgeSld(sld,-step,g.querySelector('.sval')); });
    if(sup) sup.addEventListener('pointerdown',ev=>{ ev.preventDefault(); nudgeSld(sld,step,g.querySelector('.sval')); });
  }
  bindLive(g,blocks);
  bindAudio(g,blocks.find(b=>b.k==='audiomid'));
  bindAlarmEdit(g,blocks);
  fitBig(g);
  const rows=[...g.querySelectorAll('.brow')]; let ri=0;
  for(const b of blocks){ if(b.k!=='row') continue; const rowEl=rows[ri++];
    b.cells.forEach((c,ci)=>{ const btn=rowEl.querySelector('[data-c="'+ci+'"]'); if(!btn)return;
      bindCell(btn,c);
      btn.addEventListener('pointerdown',ev=>{ ev.preventDefault();
        if(c.nav){ _crumbNext={lvl:stack.length, html:svg(ICONS[c.icon]||ICONS.info)}; nav(c.nav); return; }
        if(btn._menu){ openMenu(btn,btn._menu); return; }
        if(btn._cmd) sendCmd(btn._cmd.uuid,btn._cmd.cmd,view&&view.secured);
        if(btn._hold) holdRelease=btn._release||null;
      });
    });
  }
  const fb=blocks.find(b=>b.k==='favs'); const fe=g.querySelector('.favs');
  if(fb&&fe){ fe.querySelectorAll('.fav').forEach(n=>{ const f=fb.items[+n.dataset.f]; if(!f)return;
    // Erst beim Tippen: die Favoriten liegen im scrollenden Raster, ein Wischer
    // darueber startet sonst einen Sender (aus LoxPanel #66).
    n.addEventListener('click',()=>{ if(f.cmd){ send({t:'cmd',uuid:f.cmd.uuid,cmd:f.cmd.cmd}); back(); } }); }); }
  g.dataset.bsig=blockSig(blocks);   // Grundlage fuer den In-place-Abgleich in updatePanel
  renderTabs();
  panelEinpassen();
}
// Grosse Anzeige ohne Ziffern (Status-Wort) -> .word (auf breiten Seiten kleiner)
function markWords(g){ g.querySelectorAll('.pbig').forEach(e=>e.classList.toggle('word', !/\d/.test(e.textContent))); }
// Szenen/Radiotasten: so viele Reihen, dass alle Tasten ohne Scrollen passen -
// solange eine Taste dabei mindestens 64 px hoch bleibt (sonst wird geblaettert)
function fitScenes(g){ g.querySelectorAll('.scenes').forEach(sc=>{
  const n=sc.children.length; if(!n) return;
  // Eintraege einer Detailansicht folgen dem Listen-Schema (CSS), nicht dem Einpassen
  if(sc.closest('.pantop')){ sc.style.gridAutoRows=''; sc.classList.remove('dense'); return; }
  const cols=getComputedStyle(sc).gridTemplateColumns.split(' ').filter(Boolean).length||2;
  const need=Math.ceil(n/cols), H=sc.clientHeight, maxR=Math.max(2, Math.floor((H+10)/(64+10)));
  const rows=Math.max(1, Math.min(need, maxR));
  sc.style.gridAutoRows=rows>2||need<2?'calc((100% - '+(rows-1)*10+'px) / '+rows+')':'';
  sc.classList.toggle('dense', rows>2); }); }
function panelEinpassen(){
  const g=el('grid'); if(!g.classList.contains('panel')) return;
  markWords(g); fitScenes(g);
  g.classList.remove('eng');
  if(g.scrollHeight>g.clientHeight+1) g.classList.add('eng');
}
function updatePanel(blocks){
  const g=el('grid');
  // Struktur anders als zuletzt gerendert (Zeile/Status/Favorit dazu oder weg,
  // Favoriten per roomfav/get nachgeliefert)? Dann komplett neu aufbauen.
  if(g.dataset.bsig!==blockSig(blocks)){ renderPanel(blocks); return; }
  const rowBlocks=blocks.filter(b=>b.k==='row');
  const rows=[...g.querySelectorAll('.brow')];
  // Ab hier ist die Struktur nachweislich identisch -> jeden Block an SEINER
  // Position patchen, nicht nur den ersten seiner Art: Detailseiten wie die
  // Sauna haben mehrere Status-Zeilen (Tuer, Wasser, Stoerung ...), die sonst
  // auf dem Stand des ersten Renderns einfrieren.
  const nth=(k,sel,fn)=>{ const es=[...g.querySelectorAll(sel)];
    blocks.filter(b=>b.k===k).forEach((b,i)=>{ if(es[i]) fn(es[i],b); }); };
  nth('status','.status:not(.alist-empty)',(e,b)=>{ e.textContent=b.text||''; });
  nth('value','.pbar',(e,b)=>{ e.textContent=b.text||''; });
  nth('big','.pbig:not(.sbar .pbig):not(.dimcard .pbig):not(.dstate .pbig):not(.aedit .pbig)',(e,b)=>{ const h=fmtBig(b.text); if(e.innerHTML!==h) e.innerHTML=h; e.className='pbig'+(b.tone==='good'?' good':(b.tone==='crit'?' crit':'')); });
  nth('title','.ptitle',(e,b)=>{ e.childNodes[0].nodeValue=b.text||''; const su=e.querySelector('.psub'); if(su)su.textContent=b.sub||''; });
  nth('astat','.astat',(e,b)=>{ e.childNodes[0].nodeValue=b.text||''; e.className='astat'+(b.tone==='crit'?' crit':''); const su=e.querySelector('.astatsub'); if(su)su.textContent=b.sub||''; });
  const cov=blocks.find(b=>b.k==='cover'); if(cov){const img=g.querySelector('#coverimg'); if(img&&img.getAttribute('src')!==cov.src){img.style.opacity='0'; img.onload=()=>img.style.opacity='1'; img.onerror=()=>img.style.opacity='0'; img.src=cov.src;}}
  const sb=blocks.find(b=>b.k==='slider'); if(sb){const sld=g.querySelector('.sld'); if(sld&&!sldDragging){ sld.value=sb.value; sldFill(sld); const sv=g.querySelector('.sval'); if(sv)sv.textContent=sb.value; }}
  patchLive(g,blocks);
  markWords(g);
  const efb=blocks.find(b=>b.k==='eflow'); if(efb){ const d=g.querySelector('[data-eflow]'); if(d){ paintEnergy(d, efb.e); fitEflow(d); } }   // Radial live aktualisieren (in-place)
  paintCharts(g,blocks);   // Verlauf nachgeladen oder Fenster vorgerueckt: neu zeichnen, Knoepfe bleiben
  rowBlocks.forEach((b,ri)=>{ const rowEl=rows[ri]; if(!rowEl)return;
    b.cells.forEach((c,ci)=>{ const btn=rowEl.querySelector('[data-c="'+ci+'"]'); if(!btn)return;
      if(c.icon){ const h=cellIco(c.icon); if(btn.innerHTML!==h) btn.innerHTML=h; btn.className='btn icon'+(c.big?' big':'')+(isChartCell(c)?' cht':'')+(c.on?' on':''); }
      else { btn.textContent=c.label; btn.className='btn'+(c.menu?' toggler':'')+(c.on?' on':''); }
      bindCell(btn,c);
    });
  });
}

// Kartenfarbe je Tab (Design): 1. Tab = Farbe 1 usw., ab dem 6. wieder von vorn.
function applyFace(){

// Raum-Panel-Kontext: der (einzige) Profil-Tab ist ein Raum. Dann bleiben in
// ALLEN Ansichten (auch Detail) die Kategorie-Tabs + mittiger Zurueck-Button
// unten stehen. roomCatTabs merkt sie sich fuer Ansichten ohne eigene catTabs.
function isRoomPanel(){ return tabsCfg.length===1 && String(tabsCfg[0]||'').indexOf('room:')===0; }
let roomCatTabs=null, pendingCatScroll=null;

function renderTabs(){
  // Raum-Panel: die untere Leiste zeigt die im Raum vorkommenden Kategorien
  // (vom Server als view.catTabs) als SCROLL-Tabs - ein Tipp scrollt zur Gruppe,
  // statt die Seite zu wechseln. Aufbau wie sonst: Zurueck links, Tabs rechts.
  // In Detailansichten (kein view.catTabs) die gemerkten Tabs weiterzeigen.
  const ct = (view && Array.isArray(view.catTabs) && view.catTabs.length) ? view.catTabs
           : (isRoomPanel() && roomCatTabs && roomCatTabs.length ? roomCatTabs : null);
  // Leiste: Zurueck ganz links (im Look der Tabs), Tabs rechtsbuendig in
  // umgekehrter Reihenfolge - Tab 1 steht ganz rechts, Tab 2 links daneben usw.
  // Oberste Ebene: Dashboard-Symbol (fuehrt zum Screensaver = Dashboard);
  // darunter ein Pfeil, der eine Ebene zurueck geht.
  const backHtml = stack.length>1
    ? '<div class="tabback on" id="tabback" title="Zurück">'+svg('<path d="m15 6-6 6 6 6"/>')+'</div>'
    : '<div class="tabback dash" id="tabback" title="Dashboard">'+svg(dashIconInner())+'</div>';
  const bar = t => [backHtml,'<div class="tabspacer crumbs">'+crumbsHtml(Math.min(4,t.length))+'</div>'].concat(t.slice(0,4).reverse());
  let items;
  if(ct){
    const tabsHtml = ct.map(c => {
      const ico = c.iconUrl
        ? '<span class="tico" style="--u:url(\''+esc(c.iconUrl)+'\')"></span>'
        : svg('<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/>');
      return '<div class="tab" data-cat="'+esc(c.key)+'" title="'+esc(c.label||'')+'">'+ico+'</div>';
    });
    items = bar(tabsHtml);
  } else {
    const at = activeTab();
    items = tabsCfg.map(tk => {
      const cls = 'tab'+(tk===at?' active':'');
      const t = TABS.find(x => x.tab===tk), m0 = tabMeta[tk];
      // Eigenes Symbol aus der Config (tabMeta icon/iconUrl/iconImg) vor dem Standard
      if(m0 && (m0.icon || m0.iconImg || (t && m0.iconUrl))){
        const ico = m0.icon ? svg(ICONS[m0.icon]||ICONS.info)
          : m0.iconImg ? '<img class="tico img" src="'+esc(m0.iconImg)+'" alt="">'
          : '<span class="tico" style="--u:url(\''+esc(m0.iconUrl)+'\')"></span>';
        return '<div class="'+cls+'" data-tab="'+esc(tk)+'" title="'+esc(m0.label||(t&&t.label)||'')+'">'+ico+'</div>';
      }
      if(t) return '<div class="'+cls+'" data-tab="'+esc(tk)+'" title="'+esc(t.label)+'">'+svg(t.icon)+'</div>';
      const m = tabMeta[tk]; if(!m) return '';   // dynamischer Tab (Kategorie/Raum)
      // Ohne Bild aus Loxone: Raum bekommt das Raum-Symbol, Kategorie den Wuerfel -
      // sonst sehen ein Raum- und ein Kategorie-Tab identisch aus.
      const tb = TABS.find(x => x.tab===tk.split(':')[0]);   // weitere Uebersicht/Zentral: Symbol des Grundtyps
      const fallback = tb ? tb.icon : tk.indexOf('room:')===0
        ? '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M14 4v16"/>'
        : tk.indexOf('free:')===0   // freier Tab: Raster-Symbol
        ? '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>'
        : '<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/>';
      const ico = m.iconUrl
        ? '<span class="tico" style="--u:url(\''+esc(m.iconUrl)+'\')"></span>'
        : svg(fallback);
      return '<div class="'+cls+'" data-tab="'+esc(tk)+'" title="'+esc(m.label||'')+'">'+ico+'</div>';
    }).filter(Boolean);
    // Zurueck-Button immer da (auch auf der obersten Ebene: fuehrt zum
    // Screensaver zurueck, siehe back()).
    items = bar(items);
  }
  el('tabs').innerHTML = items.join('');
  // Tab-Namen (nur sichtbar auf Tablets mit Platz, html.sqbig): aus dem title
  el('tabs').querySelectorAll('.tab[title]').forEach(t=>{ const l=t.getAttribute('title'); if(l) t.insertAdjacentHTML('beforeend','<span class="tlbl">'+esc(l)+'</span>'); });
  applyFace();
  if(ct) el('tabs').querySelectorAll('.tab[data-cat]').forEach(n => n.onclick=()=>{ if(!justLeftSaver()) scrollToCat(n.dataset.cat); });
  else   el('tabs').querySelectorAll('.tab').forEach(n => n.onclick=()=>{ if(!justLeftSaver()) goTab(n.dataset.tab); });
  const tb = el('tabs').querySelector('#tabback'); if(tb) tb.onclick = ()=>{ if(!justLeftSaver()) back(); };
  el('tabs').querySelectorAll('.crumb[data-lvl]').forEach(n=>n.onclick=()=>{ if(!justLeftSaver()) crumbJump(+n.dataset.lvl); });
  applyPane();
}
// Raum-Panel: zur ersten Kachel einer Kategorie scrollen. Sind wir in einer
// Detailansicht (die Kachel ist gerade nicht da), erst zurueck in den Raum und
// nach dem Rendern dorthin scrollen (pendingCatScroll, s. render()).
function scrollToCat(key){
  const d = el('grid').querySelector('.tile[data-cat="'+key+'"]');
  if(d){ d.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  pendingCatScroll = key;
  const rt = tabsCfg[0]; if(rt) goTab(rt);
}
// ---- Split-Pane pro Tab: entscheidet je aktuellem Tab, was rechts steht ----
// Wert je Tab: "weather" | "calendar" | "player:<zone-uuid>" | "energy:<uuid>" | "camera:<uuid>" | "chart:<uuid>".
function paneForTab(tk){ return tk ? (panesCfg[tk]||null) : null; }
function paneKind(v){ return v ? (v.indexOf('player:')===0 ? 'player' : (v.indexOf('energy:')===0 ? 'energy' : (v.indexOf('camera:')===0 ? 'camera' : (v.indexOf('chart:')===0 ? 'chart' : v)))) : null; }
function applyPane(){
  const sc=document.querySelector('.screen'); if(!sc) return;
  const raw=(themeSplit&&!isPhone())?paneForTab(activeTab()):null;   // Split aus (4"-Panel) / Handy -> keine Pane 2
  const kind=paneKind(raw);
  const isPane=(kind==='player'||kind==='weather'||kind==='calendar'||kind==='energy'||kind==='camera'||kind==='chart');   // Widget in Pane 2
  sc.classList.toggle('split', isPane);   // Widget -> zweigeteilt, sonst "Screen fuellen"
  sc.classList.toggle('fill', themeFill);  // "Bildschirm fuellen" fuellt Split UND Screen-fuellen
  applyScale();
  const pp=el('playerpane'), fp=el('frontpane');
  if(pp) pp.hidden=(kind!=='player');
  if(fp){
    fp.hidden=!(kind==='weather'||kind==='calendar'||kind==='energy'||kind==='camera'||kind==='chart');
    fp.classList.toggle('cam', kind==='camera');
    // Kamera verlassen -> Video-Stream stoppen (Inhalt leeren), keine Hintergrund-Verbindung.
    if(kind!=='camera' && fp.dataset.cam!==undefined){ fp.innerHTML=''; delete fp.dataset.cam; delete fp.dataset.camsig; }
  }
  if(kind==='weather') renderWeatherPane(fp);
  else if(kind==='calendar') renderCalendarPane(fp);
  else if(kind==='energy') renderEnergyPane(fp);
  else if(kind==='camera') renderCameraPane(fp);
  else if(kind==='chart') renderChartPane(fp);
  // Player-Zone dieses Tabs dem Server melden (nur bei Aenderung -> er pusht die Blocks).
  const zone=(kind==='player')?raw.slice(7):'';
  if(zone!==curPlayerZone){ curPlayerZone=zone; _playerBuilt=false; try{ send({t:'setplayer',zone:zone}); }catch(e){} }
  // Energiefluss-Kachel dieses Tabs dem Server melden (er pusht dann {t:'energy'}).
  const euid=(kind==='energy')?raw.slice(7):'';
  if(euid!==curEnergyUuid){ curEnergyUuid=euid; try{ send({t:'setenergy',uuid:euid}); }catch(e){} }
  // Kamera (Intercom) dieses Tabs dem Server melden (er pusht dann {t:'camera'} mit Video+Buttons).
  const cuid=(kind==='camera')?raw.slice(7):'';
  if(cuid!==curCameraUuid){ curCameraUuid=cuid; cameraData=null;
    if(fp){ delete fp.dataset.cam; delete fp.dataset.camsig; }
    try{ send({t:'setcamera',uuid:cuid}); }catch(e){}
    if(cuid&&kind==='camera') renderCameraPane(fp);   // sofort Platzhalter zeigen, bis der Push kommt
  }
  // Verlaufs-Pane: Baustein und gewaehlten Zeitraum melden (er pusht dann
  // {t:'chart'}).
  const chuid=(kind==='chart') ? raw.slice(6) : '';
  const chkey=chuid ? chuid+'|'+chartRange : '';
  if(chkey!==curChartKey){ curChartKey=chkey; try{ send({t:'setchart',uuid:chuid,range:chartRange}); }catch(e){} }
}

// Inline-Style (CSS-Variablen + Farben) einer Kachel — von render() und
// updateGrid() gemeinsam genutzt, liefert den ROHEN Style (ohne HTML-Escape).
function tileVarStyle(it){
  const sv=[]; const ts=it.style||{};
  if(it.colorFixed){ sv.push('--ico:'+it.colorFixed); sv.push('--ico-fixed:'+it.colorFixed); }
  else if(it.color) sv.push('--ico:'+it.color);
  if(ts.bg) sv.push('background:'+ts.bg);
  if(ts.border) sv.push('border-color:'+ts.border);
  if(ts.txt) sv.push('color:'+ts.txt);
  if(ts.font) sv.push('font-family:'+ts.font);
  return sv.join(';');
}
function tileTone(it){ return it.tone==='good'?' good':(it.tone==='crit'?' crit':(it.on?' on':'')); }
// Positionsring: EINE Quelle fuer Vollrender und In-place-Patch. Vorher stand
// der Umfang zweimal als Zahl im Render-Zweig; sobald der Patch dazukam, waere
// er die dritte Stelle gewesen, an der sich derselbe Wert aendern muss.
// Dynamisches Jalousie-Piktogramm (wie in der Loxone-App): Fensterrahmen mit
// einem Behang, der von oben zufaehrt. 0 = offen, 100 = ganz zu. Bewegt wird
// per CSS-transform scaleY (breit unterstuetzt, auch auf aelteren WebViews -
// anders als animierte SVG-Geometrie oder clip-path), Ursprung ist die
// Fenster-Oberkante, dadurch faehrt der Behang nach unten und animiert
// zwischen zwei Staenden weich mit.
function blindIcon(pct, shape){
  const p=Math.max(0,Math.min(100,Number(pct)||0))/100;
  // shape 'gate' = Garagentor (breiter, auf dem Boden stehend, Segmente),
  // sonst Rollladen. Beide fahren nach demselben Prinzip zu: die
  // Behang-Gruppe wird von der Oberkante aus per scaleY aufgezogen.
  const gate = shape==='gate';
  if(!gate){
    // Rollladen exakt nach dem Loxone-Webinterface (Snap-SVG, viewBox 30):
    // gefuellter Rahmen 2 Einheiten stark, der Behang ist ein voller Block
    // (jal_slats_vertical, x7 y5 16x20), der von oben hereinfaehrt. Loxone
    // verschiebt ihn per translate und clippt; ein von der Oberkante aus per
    // scaleY aufgezogener Block sieht identisch aus und braucht keinen Clip.
    return '<span class="ico blindico"><svg viewBox="0 0 30 30" fill="currentColor" aria-hidden="true">'+
      '<path d="M24,4V26H6V4H24m2-2H4V28H26V2Z"/>'+
      '<path d="M14.5 4h1v22h-1zM6 14.5h18v1H6z" opacity=".3"/>'+   // Sprossen, dezent
      '<g class="sh" style="transform:scaleY('+p.toFixed(3)+')"><rect x="7" y="5" width="16" height="20"/></g>'+
      '</svg></span>';
  }
  const box = {x:3,y:6,w:18,h:13};
  const lines = 'M3 10h18M3 14h18M3 18h18';
  return '<span class="ico blindico gateico"><svg viewBox="0 0 24 24" fill="none" '+
    'stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
    '<path d="M2 21h20"/>'+       // Bodenlinie: Tor steht auf dem Boden
    '<g class="sh" style="transform:scaleY('+p.toFixed(3)+')">'+
      '<rect x="'+box.x+'" y="'+box.y+'" width="'+box.w+'" height="'+box.h+'" fill="currentColor" stroke="none" opacity=".3"/>'+
      '<path d="'+lines+'"/>'+
    '</g>'+
    '<rect x="'+box.x+'" y="'+box.y+'" width="'+box.w+'" height="'+box.h+'"/>'+
    '</svg></span>';
}
// Fenster-Piktogramm (Window/WindowMonitor): Rahmen mit Kreuz (Sprossen), das
// Kreuz verschwindet proportional beim Oeffnen - eigenstaendiges Design,
// bewusst NICHT der Jalousie-Lamellenstil (andere Bauart, andere Optik).
function windowIcon(pct){
  const p=Math.max(0,Math.min(100,Number(pct)||0))/100;
  // Gleicher Loxone-Rahmen wie beim Rollladen (viewBox 30); geschlossen mit
  // Sprossen, offen ohne.
  return '<span class="ico windowico"><svg viewBox="0 0 30 30" fill="currentColor" aria-hidden="true">'+
    '<path d="M24,4V26H6V4H24m2-2H4V28H26V2Z"/>'+
    '<g class="cr" style="opacity:'+p.toFixed(3)+'"><path d="M14.5 4h1v22h-1zM6 14.5h18v1H6z"/></g>'+
    '</svg></span>';
}
// Live-Update der Kachel-Ansicht OHNE Neuaufbau: aktualisiert nur die
// veraenderlichen Teile (Zustand/Farben/Sublabel/Steuer-Icons) der bestehenden
// Kacheln. Verhindert das Flackern (Icons/Cover werden nicht neu geladen).
// Gibt false zurueck, wenn sich die Struktur geaendert hat -> voller render().
function updateGrid(items){
  const g=el('grid');
  if(g.classList.contains('panel')) return false;
  const nodes=g.querySelectorAll('.tile[data-id]');
  if(nodes.length!==items.length || !nodes.length) return false;
  // Struktur-Abgleich statt Pauschal-Neuaufbau: {t:'view'} kommt nicht nur
  // bei echter Navigation, sondern auch laufend bei jeder Live-Wertaenderung
  // im Haus (_broadcast_tick) - ein Pauschal-"immer alles neu aufbauen" fuer
  // jede Ansicht mit Schaltern waere bei einem lebhaften Haus (haeufige
  // Aenderungen) spuerbar teuer. Stattdessen wird nur dann ein voller
  // Neuaufbau erzwungen, wenn sich die Struktur einer Kachel TATSAECHLICH
  // geaendert hat (Schalter/Taster-Button/Mini-Buttons kommen dazu, fallen
  // weg oder aendern sich in der Anzahl) - sonst reicht das schnelle Patchen.
  for(let i=0;i<items.length;i++){
    if(String(items[i].id)!==nodes[i].dataset.id) return false;
    if(!!items[i].toggle !== !!nodes[i].querySelector('.tswitch')) return false;
    if(!!items[i].tap !== !!nodes[i].querySelector('.tapbtn')) return false;
    if(!!items[i].updown !== !!nodes[i].querySelector('.updown')) return false;
    if(!!items[i].prevnext !== !!nodes[i].querySelector('.prevnext')) return false;
    if((typeof items[i].blind === 'number') !== !!nodes[i].querySelector('.blindico')) return false;
    if((typeof items[i].winpos === 'number') !== !!nodes[i].querySelector('.windowico')) return false;
    const cn = items[i].controls ? items[i].controls.length : 0;
    if(cn !== nodes[i].querySelectorAll('.tctrls .tb').length) return false;
  }
  const _pg=(view.layout==='list'?4:gridCols*gridRows);
  let ok=true;
  items.forEach((it,i)=>{
    const n=nodes[i];
    const prev=n._it;
    n._it=it;
    // Animierte Symbole: Einschalten -> Symbol ploppt kurz; neuer Wert -> Statuszeile tickt
    if(prev&&!prev.on&&it.on) animOnce(n.querySelector('.head>:first-child'),'an-pop');
    else if(prev&&prev.sublabel&&it.sublabel&&prev.sublabel!==it.sublabel) setTimeout(()=>animOnce(n.querySelector('.body .sub'),'an-val'),0);
    const cls='tile'+tileTone(it)+(it.anim?' an-'+it.anim:'')+(i%_pg===0?' snap':'')+[...n.classList].filter(c=>c.startsWith('spark')).map(c=>' '+c).join('');
    if(n.className!==cls) n.className=cls;
    const stStr=tileVarStyle(it);
    if((n.getAttribute('style')||'')!==stStr) n.setAttribute('style',stStr);
    const body=n.querySelector('.body');
    if(body){ let subEl=body.querySelector('.sub');
      if(it.sublabel){ if(!subEl){ subEl=document.createElement('div'); subEl.className='sub'; body.appendChild(subEl); }
        if(subEl.textContent!==it.sublabel) subEl.textContent=it.sublabel; }
      else if(subEl){ subEl.remove(); } }
    if(it.controls){ const tbs=n.querySelectorAll('.tctrls .tb');
      if(tbs.length===it.controls.length) it.controls.forEach((c,ci)=>{ const b=tbs[ci]; if(!b) return;
        b._cmd=c.cmd; b._secured=it.secured;
        const nh=svgF(ICONS[c.icon]||ICONS.info); if(b.innerHTML!==nh) b.innerHTML=nh; }); }
    if(it.toggle){ const sw=n.querySelector('.tswitch');
      if(sw) sw.classList.toggle('on', !!it.toggle.on); }   // Zustand live nachziehen (z.B. von woanders geschaltet)
    if(typeof it.blind === 'number'){ const sh=n.querySelector('.blindico .sh');
      if(sh){ const p=(Math.max(0,Math.min(100,it.blind))/100).toFixed(3);
        const tf='scaleY('+p+')'; if(sh.style.transform!==tf) sh.style.transform=tf; } }
    if(typeof it.winpos === 'number'){ const cr=n.querySelector('.windowico .cr');
      if(cr){ const p=(Math.max(0,Math.min(100,it.winpos))/100).toFixed(3);
        if(cr.style.opacity!==p) cr.style.opacity=p; } }
    // Zahlen-Plakette: dazu/weg oder andere Stellenzahl -> neu aufbauen, sonst Zahl tauschen
    { const cb=n.querySelector('.cbn'), want=it.count>0?(it.count>99?'99+':String(it.count)):'';
      if(!!cb!==!!want || (cb&&cb.textContent.length!==want.length)) ok=false;
      else if(cb&&cb.textContent!==want) cb.textContent=want; }
    // Mini-Verlauf: dazu oder weg -> neu aufbauen, sonst nur bei Aenderung neu zeichnen
    const spEl=n.querySelector('.tspark'), bdEl=n.querySelector('.tsbadge'), bd=it.spark&&it.spark.badge;
    if(!!it.spark!==!!spEl || !!bd!==!!bdEl) ok=false;
    else if(spEl){ paintSpark(spEl,it.spark);
      n.querySelectorAll('.tsbadge,.tsline').forEach(e=>{ if(e.textContent!==bd) e.textContent=bd; }); }
  });
  return ok;
}
// Doppeltipp-Fenster: 350 ms - lang genug fuer traege Touchscreens (Shelly
// Wall Display), kurz genug, dass der einfache Tipp nicht haengt.
const DBL_TAP_MS=350;
let _dblTap=null;   // {id,timer} - wartender erster Tipp auf eine Lichtkachel
// Symbol mit Zahlen-Plakette ("ausgebissen", s. .cbw). size: feste Symbolgroesse in px (sonst --ico-size)
function cbHtml(icon, n, tone, size, big){
  const t=n>99?'99+':String(n), cls=t.length>=3?'n3':(t.length===2?'n2':'n1');
  return '<span class="cbw '+cls+(big?' big':'')+'"'+(size?' style="--cbs:'+size+'px"':'')+'><span class="cbi">'+icon+'</span>'+
    '<b class="cbn'+(tone?' '+esc(tone):'')+'">'+t+'</b></span>';
}
// Eine Kachel als HTML - gemeinsam fuer das Raster und den Screensaver.
// extraCls: zusaetzliche Klassen (z.B. ' snap' fuers Seiten-Snapping).
function tileHtml(it, extraCls){
  const icoHtml = (typeof it.blind === 'number')
    ? blindIcon(it.blind, it.blindShape)
    : (typeof it.winpos === 'number')
    ? windowIcon(it.winpos)
    : it.iconImg
    ? '<span class="ico"><img class="rawico" src="'+esc(it.iconImg)+'" alt=""></span>'
    : it.iconUrl
    ? '<span class="ico img" style="--u:url(\''+esc(it.iconUrl)+'\')"></span>'
    : '<span class="ico">'+svg(ICONS[it.icon]||ICONS.info)+'</span>';
  const icoCell = it.count>0 ? cbHtml(icoHtml, it.count, it.countTone) : icoHtml;
  // Einzelner Ein/Aus-Schnellschalter (Switch/TimedSwitch): eigener Schieber
  // oben rechts, an der Stelle des Pfeils (ersetzt ihn) - wie im Original-
  // Loxone-Plugin. Mehrere Bedienelemente (z.B. Player-Transport: zurueck/
  // Play/weiter) bleiben als Reihe unten (tctrls), dafuer ist oben kein Platz.
  const chev = (it.nav && !it.controls && !it.toggle && !it.tap && !it.updown && !it.prevnext)
    ? '<span class="chev">'+svg('<path d="m9 6 6 6-6 6"/>')+'</span>' : '';
  const togg = it.toggle
    ? '<span class="tswitch'+(it.toggle.on?' on':'')+'" data-tog="1"><span class="knob"></span></span>' : '';
  // Runder Taster-Button (Pushbutton): wie togg oben rechts platziert, aber
  // OHNE Ein/Aus-Zustand - ein Taster hat keinen dauerhaften Zustand, nur
  // einen kurzen Impuls beim Antippen.
  const tapb = it.tap
    ? '<span class="tapbtn" data-tap="1">'+svg('<circle cx="12" cy="12" r="7"/>')+'</span>' : '';
  // Auf/Ab-Mini-Buttons (Jalousie) oben rechts, wie in der Loxone-App -
  // bewusst per CLICK statt pointerdown gebunden (siehe Bindung unten),
  // damit ein Scroll-Wisch, der zufaellig hier beginnt, nicht die
  // Beschattung losfahren laesst (anders als .tctrls/.tb).
  const updown = it.updown
    ? '<span class="updown" data-updown="1"><span class="ub" data-dir="up">'+svg(ICONS.up)+'</span><span class="ub" data-dir="down">'+svg(ICONS.down)+'</span></span>' : '';
  // Horizontale </>-Mini-Buttons (Lichtszenen durchschalten) - gleiches
  // Prinzip/Design wie updown, nur nebeneinander statt uebereinander, auch
  // per CLICK gebunden (kein Scroll-Wisch-Konflikt).
  const prevnext = it.prevnext
    ? '<span class="prevnext" data-prevnext="1"><span class="ub" data-dir="prev">'+svg('<path d="m15 6-6 6 6 6"/>')+'</span><span class="ub" data-dir="next">'+svg('<path d="m9 6 6 6-6 6"/>')+'</span></span>' : '';
  const ctrls = it.controls ? '<div class="tctrls">'+it.controls.map((c,i)=>'<span class="tb" data-c="'+i+'">'+svgF(ICONS[c.icon]||ICONS.info)+'</span>').join('')+'</div>' : '';
  const tone = tileTone(it);
  const ts=it.style||{};
  const stStr = tileVarStyle(it);
  const st = stStr?' style="'+esc(stStr)+'"':'';
  const nsv=[];
  if(ts.txt) nsv.push('color:'+ts.txt);
  if(ts.font) nsv.push('font-family:'+ts.font);
  if(ts.weight) nsv.push('font-weight:'+ts.weight);
  if(ts.italic) nsv.push('font-style:italic');
  const nst = nsv.length?' style="'+esc(nsv.join(';'))+'"':'';
  return '<div class="tile'+tone+(it.anim?' an-'+esc(it.anim):'')+(extraCls||'')+'" data-id="'+esc(it.id)+'"'+(it.catKey?' data-cat="'+esc(it.catKey)+'"':'')+st+'>'+
          '<div class="head">'+icoCell+(it.spark&&it.spark.badge?'<span class="tsbadge">'+esc(it.spark.badge)+'</span>':'')+
            chev+togg+tapb+updown+prevnext+'</div>'+
          (it.spark?'<div class="tspark"></div>':'')+   // Mini-Verlauf (gezeichnet in bindTile, erst dann ist die Groesse bekannt)
          '<div class="body">'+
          (it.room?'<div class="room">'+esc(it.room)+'</div>':'')+
          (it.spark&&it.spark.badge?'<div class="room tsline">'+esc(it.spark.badge)+'</div>':'')+
          '<div class="name"'+nst+'>'+esc(it.label)+'</div>'+
          (it.sublabel?'<div class="sub">'+esc(it.sublabel)+'</div>':'')+'</div>'+
          ctrls+
        '</div>';
}
// Bedienung einer Kachel binden - gemeinsam fuer Raster und Screensaver.
function bindTile(n, it){
  if(!it) return;
  n._it = it;   // aktuelle Daten am Knoten -> updateGrid kann sie in-place ersetzen
  if(it.spark) paintSpark(n.querySelector('.tspark'), it.spark);   // Mini-Verlauf
  if(it.controls){
    n.querySelectorAll('.tctrls .tb').forEach(b=>{
      b._cmd = it.controls[+b.dataset.c].cmd; b._secured = it.secured;
      // Erst beim Tippen (click: Aufsetzen und Loslassen ohne Wischen), nicht
      // schon beim Aufsetzen: ein Wischer, der auf der Taste beginnt, scrollt
      // das Raster, statt den Befehl zu senden (aus LoxPanel #66).
      b.addEventListener('click', ev=>{ ev.stopPropagation();
        if(justLeftSaver()) return;
        if(b._cmd) sendCmd(b._cmd.uuid,b._cmd.cmd,b._secured); });
    });
  }
  if(it.toggle){
    const sw=n.querySelector('.tswitch');
    if(sw) sw.addEventListener('pointerdown', ev=>{ ev.preventDefault();
      if(justLeftSaver()) return;
      const t=n._it||it; if(t.toggle&&t.toggle.cmd) sendCmd(t.toggle.cmd.uuid,t.toggle.cmd.cmd,t.secured); });
  }
  if(it.tap){
    const tb=n.querySelector('.tapbtn');
    if(tb) tb.addEventListener('pointerdown', ev=>{ ev.preventDefault();
      if(justLeftSaver()) return;
      const t=n._it||it; if(t.tap&&t.tap.cmd) sendCmd(t.tap.cmd.uuid,t.tap.cmd.cmd,t.secured);
      // 0,8s gruenes Nachleuchten als Bestaetigung, nicht nur :active
      // waehrend des Drauftippens selbst (das ist schon vorbei, sobald der
      // Finger wieder loslaesst).
      tb.classList.add('flash');
      clearTimeout(tb._flashT);
      tb._flashT=setTimeout(()=>tb.classList.remove('flash'), 800); });
  }
  if(it.updown){
    // Bewusst 'click' statt 'pointerdown': feuert nur, wenn kein Scroll/
    // Wisch dazwischenkam (siehe Kommentar bei der updown-Konstruktion oben).
    n.querySelectorAll('.updown .ub').forEach(ub=>{
      ub.addEventListener('click', ev=>{ ev.stopPropagation();
        if(justLeftSaver()) return;
        const t=n._it||it; const cmd=t.updown&&t.updown[ub.dataset.dir]&&t.updown[ub.dataset.dir].cmd;
        if(cmd) sendCmd(cmd.uuid,cmd.cmd,t.secured);
        // gleiches Farbfeedback wie beim Taster-Button (0,8s gruenes Nachleuchten)
        ub.classList.add('flash');
        clearTimeout(ub._flashT);
        ub._flashT=setTimeout(()=>ub.classList.remove('flash'), 800); });
    });
  }
  if(it.prevnext){
    // Gleiches Prinzip wie updown (click statt pointerdown, gleiches
    // Farbfeedback) - nur die Datenquelle ist t.prevnext statt t.updown.
    n.querySelectorAll('.prevnext .ub').forEach(ub=>{
      ub.addEventListener('click', ev=>{ ev.stopPropagation();
        if(justLeftSaver()) return;
        const t=n._it||it; const cmd=t.prevnext&&t.prevnext[ub.dataset.dir]&&t.prevnext[ub.dataset.dir].cmd;
        if(cmd) sendCmd(cmd.uuid,cmd.cmd,t.secured);
        ub.classList.add('flash');
        clearTimeout(ub._flashT);
        ub._flashT=setTimeout(()=>ub.classList.remove('flash'), 800); });
    });
  }
  n.onclick=(e)=>{ if(justLeftSaver()) return;
    if(e.target.closest('.tctrls')||e.target.closest('.tswitch')||e.target.closest('.tapbtn')||e.target.closest('.updown')||e.target.closest('.prevnext')) return; const t=n._it||it;
    const act=()=>{ const u=n._it||t;
      if(u.nav){ if(n.closest('#saver')) saverNav(u.nav); else { zoomFrom(n); crumbFrom(n); nav(u.nav); } } else if(u.cmd) sendCmd(u.cmd.uuid,u.cmd.cmd,(view&&view.secured)||u.secured); };
    // Doppeltipp = Licht aus (nur wenn der Server dblOff mitliefert: Licht
    // an + Option aktiv). Eigene Erkennung ueber zwei 'click' statt
    // 'dblclick', das Android-WebViews (Shelly Wall Display) und iOS bei
    // Touch nicht zuverlaessig liefern. Nur diese Kacheln warten kurz auf
    // den zweiten Tipp, alle anderen reagieren weiter sofort.
    if(!t.dblOff){ act(); return; }
    if(_dblTap && _dblTap.id===n.dataset.id){
      clearTimeout(_dblTap.timer); _dblTap=null;
      sendCmd(t.dblOff.cmd.uuid,t.dblOff.cmd.cmd,t.secured);
      n.classList.add('dblflash'); setTimeout(()=>n.classList.remove('dblflash'), 350);
      return;
    }
    if(_dblTap) clearTimeout(_dblTap.timer);
    _dblTap={id:n.dataset.id, timer:setTimeout(()=>{ _dblTap=null; act(); }, DBL_TAP_MS)}; };
}
function render(){
  if(!view) return;
  // "Screen fuellen" (kein Widget in Pane 2): die KACHELZAHL wird nach rechts
  // verdoppelt -> aus 2x2 wird 2x2|2x2 = 4x2 (GLEICHE Kachelgroesse, nur mehr
  // Kacheln). Nur im Querformat (2-Pane-Tablet); das quadratische 4"-Panel
  // bleibt einspaltig. Unabhaengig vom Zoom ("Bildschirm fuellen").
  const _k = (themeSplit && !isPhone()) ? paneKind(paneForTab(activeTab())) : null;   // Split aus / Handy -> nie Pane/Verdopplung
  const _widget = (_k==='player'||_k==='weather'||_k==='calendar'||_k==='energy'||_k==='camera'||_k==='chart');
  // Querformat-Entscheidung merken: beim Kiosk-Start / Auto-Reload meldet das
  // Fenster kurz eine quere Groesse, bevor die echte Flaeche steht. Der
  // resize-Handler rendert neu, sobald sie kippt (sonst bliebe das 4"-Panel in
  // der Startmessung 4x2 statt 2x2 haengen - dasselbe Muster wie beim Screensaver).
  _lastWide = window.innerWidth > window.innerHeight && !isPhone();
  if(themeSplit && !_widget && _lastWide){ gridCols = profCols*2; gridRows = profRows; }
  else { gridCols = profCols; gridRows = profRows; }
  document.documentElement.style.setProperty('--cols', gridCols);
  document.documentElement.style.setProperty('--rows', gridRows);
  stopVideo();
  closeMenu();
  setMore(null);
  el('conn').classList.toggle('vis', !!(view.route && view.route.view==='tab'));
  if(view.layout==='cells'){ renderCells(themeSplit && !_widget && _lastWide); return; }
  el('grid').classList.remove('cells');
  el('grid').querySelectorAll('.svw-cam img').forEach(camStop);
  el('grid').classList.remove('panel','bigpage','anchorbot','scheme');
  el('grid').classList.toggle('list', view.layout==='list');
  const items = view.items || [];
  const g = el('grid');
  // Liste auf breiter Seite (2 Flaechen): zweispaltig, 8 Zeilen je Seite
  const _wl = view.layout==='list' && g.clientWidth>700; g.classList.toggle('wide', _wl);
  if(!items.length){ g.innerHTML='<div class="empty">nichts hier</div>'; renderTabs(); return; }
  const _pg = (view.layout==='list'?(_wl?8:4):gridCols*gridRows);   // Snap-Seite: Liste 4 Zeilen, sonst cols x rows
  const html = items.map((it,i)=>tileHtml(it, i%_pg===0?' snap':'')).join('');
  g.innerHTML = html;
  g.classList.toggle('snapy', items.length > (view.layout==='list'?4:gridCols*gridRows));   // Snapping erst ab >1 Seite
  g.querySelectorAll('.tile[data-id]').forEach(n=>bindTile(n, items.find(x=>String(x.id)===n.dataset.id)));
  if(view.catTabs && view.catTabs.length) roomCatTabs = view.catTabs;   // fuer Detailansichten merken
  renderTabs();
  updateScrollInd();
  // Aus einem Detail zurueck in den Raum gesprungen? Jetzt zur Kategorie scrollen.
  if(pendingCatScroll){ const k=pendingCatScroll; pendingCatScroll=null;
    requestAnimationFrame(()=>{ const d=g.querySelector('.tile[data-cat="'+k+'"]'); if(d) d.scrollIntoView({behavior:'smooth',block:'start'}); }); }
}

// ---- Tabs mit Kachel-Raster (3x3 je Seite, wie der Screensaver) ----
// Eintraege {type,x,y,w,h,uuid?}: y 0-2 = Seite 1, 3-5 = Seite 2 ... Breite
// Flaeche ("Screen fuellen" im Querformat): zwei Seiten nebeneinander (6x3).
function renderCells(wide){
  const g=el('grid'), gs0=view.grid===2?2:3, ph=isPhone();
  // breite Widgets (ueber beide Panels) nur bei zwei Panels nebeneinander zeigen;
  // am Handy auf die Seitenbreite gekuerzt statt weggelassen
  const items=(view.cells||[]).map(it=>(ph&&it.x+it.w>gs0)?Object.assign({},it,{w:gs0-it.x}):it)
    .filter(it=>wide||it.x+it.w<=gs0);
  if(!g.classList.contains('cells')){
    g.querySelectorAll('.svw-cam img').forEach(camStop);
    g.innerHTML=''; g.classList.add('cells');
  }
  g.classList.remove('panel','bigpage','anchorbot','scheme','list','snapy');
  // Bildschirmgroesse wie bisher 480er-Einheiten (--cols/--rows steuern .screen)
  document.documentElement.style.setProperty('--cols', wide?4:2);
  document.documentElement.style.setProperty('--rows', 2);
  const gs = view.grid===2 ? 2 : 3;          // Raster je Tab: 2x2 oder 3x3
  gridCols = wide?2*gs:gs; gridRows = gs;
  const pages = Math.max(1, ...items.map(it=>Math.floor((it.y+it.h-1)/gs)+1));
  const place = wide ? (it=>{ const p=Math.floor(it.y/gs); return {c:it.x+gs*(p%2), r:it.y%gs+gs*Math.floor(p/2)}; }) : null;
  const bands = wide ? Math.ceil(pages/2) : pages;
  g.style.setProperty('--cc', gridCols);
  // Handy: so viele Zeilen je Bildschirm, dass die Kacheln etwa quadratisch sind
  g.style.setProperty('--gr', ph ? Math.max(gs, Math.round(g.clientHeight/((g.clientWidth||1)/gs))) : gs);
  g.classList.toggle('g2', gs===2); g.classList.toggle('g3', gs===3);
  // Rastanker je Seite (Wischen rastet seitenweise), unsichtbar
  let a=g.querySelectorAll('.cpage');
  if(a.length!==bands || g._gs!==gs){ a.forEach(n=>n.remove()); g._gs=gs;
    for(let i=0;i<bands;i++){ const n=document.createElement('div'); n.className='cpage';
      n.style.gridRow=(i*gs+1)+' / span '+gs; g.appendChild(n); } }
  if(!items.length){ if(!g.querySelector('.empty')){ const e=document.createElement('div'); e.className='empty'; e.textContent='nichts hier'; g.appendChild(e); } }
  else { const e=g.querySelector('.empty'); if(e) e.remove(); }
  g.classList.toggle('snapy', bands>1);
  renderLayout(g, items, view.wd||{}, place, true);
  renderTabs();
  updateScrollInd();
}

// ---- Anlagenschema (SystemScheme) ----
// Hintergrundbild + Live-Werte als Overlay. Der Viewport zeigt das Schema
// fit-to-width; Pinch/Pan zoomt und verschiebt. Antippbare Werte (nav)
// springen zur Detailansicht des Bausteins.
let schemeFit=null;
function schemeValHtml(it,i){
  const w=it.w||120, h=it.h||30;
  const cls='schemeval'+(it.on?' on':'')+(it.nav?' tap':'')+(it.tone==='crit'?' crit':'');
  return '<div class="'+cls+'" data-i="'+i+'" style="left:'+it.x+'px;top:'+it.y+'px;width:'+w+'px;height:'+h+'px">'+
    '<span>'+esc(it.text||'')+'</span></div>';
}
function renderScheme(v){
  const g=el('grid');
  g.classList.remove('panel','list','bigpage','anchorbot','snapy','cells');
  g.classList.add('scheme');
  el('conn').classList.remove('vis');
  const sw=v.sw||1300, sh=v.sh||866, items=v.items||[];
  let html='<div class="schemetitle">'+esc(v.title||'')+'</div>'+
    '<div class="schemeview" id="schemeView"><div class="schemestage" id="schemeStage" '+
    'style="width:'+sw+'px;height:'+sh+'px">';
  if(v.image) html+='<img class="schemeimg" src="'+esc(v.image)+'" alt="" draggable="false">';
  html+=items.map(schemeValHtml).join('')+'</div><div class="schemehint">Ziehen · 2 Finger zoomen</div></div>';
  g.innerHTML=html;
  const viewEl=el('schemeView'), stage=el('schemeStage');
  stage.querySelectorAll('.schemeval.tap').forEach(n=>{
    n.onclick=()=>{ const it=items[+n.dataset.i]; if(it&&it.nav) nav(it.nav); };
  });

}
function updateScheme(v){
  const stage=el('schemeStage'); if(!stage) return false;
  const nodes=stage.querySelectorAll('.schemeval');
  const items=v.items||[];
  if(nodes.length!==items.length) return false;   // Struktur anders -> voller Neuaufbau
  items.forEach((it,i)=>{
    const n=nodes[i], sp=n.querySelector('span');
    if(sp && sp.textContent!==(it.text||'')) sp.textContent=it.text||'';
    const cls='schemeval'+(it.on?' on':'')+(it.nav?' tap':'')+(it.tone==='crit'?' crit':'');
    if(n.className!==cls){ n.className=cls;
      n.onclick=it.nav?(()=>{ if(it.nav) nav(it.nav); }):null; }
  });
  return true;
}
function setupSchemeZoom(viewEl, stage, sw, sh){
  let scale=1, tx=0, ty=0, minScale=0.05;
  const apply=()=>{ stage.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')'; };
  const clamp=()=>{ const vw=viewEl.clientWidth, vh=viewEl.clientHeight, cw=sw*scale, ch=sh*scale;
    if(cw<=vw) tx=(vw-cw)/2; else tx=Math.min(0,Math.max(vw-cw,tx));
    if(ch<=vh) ty=(vh-ch)/2; else ty=Math.min(0,Math.max(vh-ch,ty)); };
  const fit=()=>{ const vw=viewEl.clientWidth, vh=viewEl.clientHeight; if(!vw||!vh) return;
    minScale=Math.min(vw/sw, vh/sh);              // "contain": ganzes Schema sichtbar
    scale=minScale;                               // Start: komplett eingepasst (Hoehe & Breite)
    tx=(vw-sw*scale)/2; ty=(vh-sh*scale)/2; clamp(); apply(); };
  const pts=new Map(); let lastDist=0;
  viewEl.onpointerdown=e=>{ viewEl.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); lastDist=0; };
  viewEl.onpointermove=e=>{ if(!pts.has(e.pointerId)) return;
    const prev=pts.get(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){ tx+=e.clientX-prev.x; ty+=e.clientY-prev.y; clamp(); apply(); }
    else if(pts.size>=2){ const a=[...pts.values()], dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);

function applyScale(){

  document.documentElement.classList.remove('sqfit','sqbig','sqst');   // natuerliche Groesse messen

  let fill=false;

      document.documentElement.classList.toggle('sqbig', !!boost);
      // Vertikaler Rhythmus: Rand E oben/unten gleich, Abstand G zwischen den
      // Bereichen (Tab-Leiste | Kacheln | Status-Zeile) im goldenen Schnitt

  // sonst zurueck in die obere Leiste vor das ✕

// "temp": nach Aussentemperatur (kalt blau -> warm gelb -> heiss orange/rot).

function ambSun(){   // [Aufgang, Untergang] in Minuten; ohne Wetter 6:30 / 19:30

function svClockHTML(it){
  return '<div class="svw-clock al-'+esc(it.align||'center')+'"><div class="t"></div>'+
    (it.date!=='none'?'<div class="d" data-fmt="'+esc(it.date||'short')+'"></div>':'')+'</div>';

function tickSaverClocks(){
  const d=nowDate();
  document.querySelectorAll('.svw-clock').forEach(c=>{
    const t=c.querySelector('.t'), ts=d.toLocaleTimeString(LANG,{hour:'2-digit',minute:'2-digit'});
    if(t&&t.textContent!==ts) t.textContent=ts;
    const dd=c.querySelector('.d'); if(dd){ const ds=dd.dataset.fmt==='long'
      ? d.toLocaleDateString(LANG,{weekday:'long',day:'numeric',month:'long',year:'numeric'})
      : d.toLocaleDateString(LANG,{weekday:'short',day:'numeric',month:'long'});
      if(dd.textContent!==ds) dd.textContent=ds; }
  });
}

  if(it.type==='energy') return svLive(it, sd)
    ? '<div class="svw-card svw-energy"><div class="epane-host"></div></div>' : '<div class="svw-empty">Energiefluss lädt …</div>';

      '<div class="spv"><div class="btn" data-v="-5">−</div><span></span><div class="btn" data-v="5">+</div></div></div></div>'
    : '<div class="svw-empty">Audio lädt …</div>';

function svLive(it, sd){

  if(it.type==='chart') return (sd.charts||{})[it.uuid+'|'+(it.range||'24h')]||null;
  if(it.type==='player') return (sd.players||{})[it.uuid]||null;
  return null;
}
// Werte der Live-Widgets in das bestehende Geruest zeichnen.
function svPaintLive(cell, it, sd){
  const d=svLive(it, sd); if(!d) return;

  const key=JSON.stringify(d); if(cell._live===key) return; cell._live=key;
  if(it.type==='chart'){
    const pg=cell.querySelector('.svw-chart'); if(!pg) return;
    pg.querySelector('.cpname').textContent=d.name||''; pg.querySelector('.cpval').textContent=d.value||'';
    paintCharts(pg, d.blocks||[]); return;

// Audio-Widget: Cover, Titel, Transport-Buttons und Lautstaerke +/- (gleiche
// Bloecke wie der Split-Player, {k:cover|title|row|slider}).
function svPaintPlayer(cell, d){
  const cover=d.find(b=>b.k==='cover'), title=d.find(b=>b.k==='title'), row=d.find(b=>b.k==='row'), sl=d.find(b=>b.k==='slider');
  const img=cell.querySelector('.spc img');
  if(img){ const src=cover&&cover.src;
    if(src){ if(img.getAttribute('src')!==src){ img.onload=()=>img.style.opacity='1'; img.onerror=()=>img.style.opacity='0'; img.src=src; } }
    else { img.removeAttribute('src'); img.style.opacity='0'; } }
  cell.querySelector('.spt').textContent=title?(title.text||''):'';
  cell.querySelector('.sps').textContent=title?(title.sub||''):'';
  const tr=cell.querySelector('.sptr'), cells=(row&&row.cells)||[];
  tr.innerHTML=cells.map((c,i)=>'<div class="btn'+(c.icon?' icon':'')+(c.big?' big':'')+'" data-c="'+i+'">'+
    (c.icon?svgF(ICONS[c.icon]||ICONS.info):esc(c.label||''))+'</div>').join('');
  tr.querySelectorAll('[data-c]').forEach(n=>{ const c=cells[+n.dataset.c];
    n.addEventListener('pointerdown',ev=>{ ev.preventDefault(); if(c&&c.cmd) send({t:'cmd',uuid:c.cmd.uuid,cmd:c.cmd.cmd}); }); });
  const v=cell.querySelector('.spv'); if(!v) return;
  v.style.display=(sl&&sl.cmd)?'':'none';
  v.querySelector('span').textContent=sl?String(sl.value):'';
  v.querySelectorAll('[data-v]').forEach(b=>b.onpointerdown=ev=>{ ev.preventDefault(); if(!sl||!sl.cmd) return;
    const nv=Math.max(0,Math.min(100,(+sl.value||0)+(+b.dataset.v)));
    send({t:'cmd',uuid:sl.cmd.uuid,cmd:sl.cmd.tmpl.replace('{v}',nv)}); });
}
// Statusleiste oben im Dashboard (Profil: saver.bar, bis zu 4 Bausteine).
// Neutral, solange alles normal ist; faerbt sich bei Hinweis/Alarm/scharf und
// zeigt dann einen kurzen Text. Tipp -> Status-Seite mit allen Details.
let _svStPrev={};
function svStRender(){
  const host=el('svSt'); if(!host) return;
  const had=host.children.length>0;
  queueMicrotask(()=>{ if((host.children.length>0)!==had && document.documentElement.classList.contains('sqfit')) applyScale(); });
  const b=saverData&&saverData.bar, chips=(b&&b.chips)||[];
  // Nur Symbole: Anzahl (z.B. offene Fenster) als Plakette oben rechts wie bei
  // Mail-Apps; reine Zustaende (scharf, ausgeloest ...) nur ueber die Symbolfarbe.
  const html=chips.map(c=>{ const n=+c.count||0;
    return '<button type="button" class="svsti lv-'+esc(c.level)+'" data-stid="'+esc(c.id)+'" title="'+esc(c.name+(c.text?': '+c.text:''))+'">'+
      (n>0?cbHtml(stIco(c),n,'',0,true):'<span class="svsico">'+stIco(c)+'</span>')+'</button>'; }).join('');
  if(host._html!==html){ host._html=html; host.innerHTML=html;
    // 480 px: ab 5 Eintraegen kompakter; passt es dann noch nicht, nur Symbole
    // (Zustand bleibt ueber Farbe/Hintergrund sichtbar, Text steht im Info-Fenster).
    host.classList.toggle('many', chips.length>4); host.classList.remove('tight');
    if(host.scrollWidth>host.clientWidth+1) host.classList.add('tight');
    host.querySelectorAll('.svsti').forEach(n=>{ const id=n.dataset.stid, l=[...n.classList].find(x=>x.startsWith('lv-'));
      if(_svStPrev[id]&&_svStPrev[id]!==l) animOnce(n,'an-pop'); _svStPrev[id]=l; }); }
  if(!host._bound){ host._bound=true;
    ['pointerdown','touchstart','mousedown'].forEach(ev=>host.addEventListener(ev,e=>e.stopPropagation()));
    host.addEventListener('click',e=>{ e.stopPropagation(); const bb=saverData&&saverData.bar; if(!bb||!e.target.closest('.svsti')) return;
      stSheet(bb, id=>saverNav({view:'control', id})); }); }
}
// Aufbauen bzw. aktualisieren. Eine Zelle wird nur neu gezeichnet, wenn sich
// ihr Inhalt geaendert hat (Kamerabild laeuft sonst ununterbrochen weiter).
function renderSaverGrid(){
  const sv=el('saver'), g=el('svGrid'); if(!sv||!g) return;
  const on=saverLayoutOn();
  sv.classList.toggle('layout', on);
  el('svClose').hidden=!(on && saverExit('x'));
  if(!on){ g.querySelectorAll('.svw-cam img').forEach(camStop); g.innerHTML=''; el('svSt').innerHTML=''; return; }
  svStRender();
  const cols=saverCols(), gs=saverGrid(), ph=isPhone() && themeSplit;
  g.style.setProperty('--svc', cols); g.style.setProperty('--svr', saverRows());
  const its = ph ? saverCfg.items.map(it=>(it.x<gs&&it.x+it.w>gs)?Object.assign({},it,{w:gs-it.x}):it)
                 : saverCfg.items.filter(it=>it.x+it.w<=cols);
  const place = ph ? (it=>it.x>=gs ? {c:it.x-gs, r:it.y+gs} : {c:it.x, r:it.y}) : null;
  const pl=phoneLandscape()&&!place, rows=saverRows(), lay=pl ? fillGaps(its, cols, rows) : its;
  // Handy quer: Reihen nach Inhalt gewichten - eine reine Uhr-Reihe braucht wenig Hoehe
  // (0,618 : 1, goldener Schnitt), Wetter/Kamera bekommen den Rest statt gequetscht zu werden.
  g.style.gridTemplateRows = pl ? Array.from({length:rows},(_,r)=>{
      const inRow=lay.filter(it=>it.y<=r&&r<it.y+it.h);
      return (inRow.length&&inRow.every(it=>it.type==='clock'&&it.h===1)) ? 'minmax(0,.618fr)' : 'minmax(0,1fr)'; }).join(' ') : '';
  renderLayout(g, lay, saverData, place, saverOn());
}
// Handy quer (flach, Touch): Widgets wachsen in leere Nachbarzellen ihrer Zeile,
// damit ein nicht voll belegtes Dashboard keine Loecher zeigt. Nur Darstellung -
// gespeichert wird nichts. Panels (Shelly 960x480) sind hoeher und bleiben unberuehrt.
// Testweise NUR auf Handys: Handy-Profil oder Handy-Browser (iPhone / Android Mobile) - nie Panels oder Tablets.
function phoneLandscape(){ return window.innerHeight<450 && window.innerWidth>window.innerHeight &&
  (themePhone || /iPhone|iPod|Android.+Mobile/i.test(navigator.userAgent)); }
function fillGaps(items, cols, rows){
  const occ=[...Array(rows)].map(()=>Array(cols).fill(false));
  const out=items.map(it=>Object.assign({},it));
  out.forEach(it=>{ for(let r=it.y;r<it.y+it.h&&r<rows;r++) for(let c=it.x;c<it.x+it.w&&c<cols;c++) occ[r][c]=true; });
  const free=(c,it)=>{ if(c<0||c>=cols) return false; for(let r=it.y;r<it.y+it.h&&r<rows;r++) if(occ[r][c]) return false; return true; };
  const take=(c,it)=>{ for(let r=it.y;r<it.y+it.h&&r<rows;r++) occ[r][c]=true; };
  [...out].sort((a,b)=>a.y-b.y||a.x-b.x).forEach(it=>{
    let grew=true; while(grew){ grew=false;
      if(free(it.x+it.w,it)){ take(it.x+it.w,it); it.w++; grew=true; }
      if(free(it.x-1,it)){ take(it.x-1,it); it.x--; it.w++; grew=true; } } });
  return out;
}
// Raster-Eintraege in ein Grid zeichnen bzw. abgleichen (Screensaver und Tabs).
// place(it) -> {c,r} (0-basiert) fuer abweichende Anordnung (breite Tabs: Seiten
// nebeneinander). Eine Zelle wird nur neu gezeichnet, wenn sich ihr Inhalt
// geaendert hat - Kamerabilder laufen sonst ununterbrochen weiter.
function renderLayout(g, items, sd, place, camsOn){
  const keys=new Set();
  items.forEach(it=>{
    const key=it.type+':'+(it.uuid||'')+':'+it.x+':'+it.y+':'+it.w+'x'+it.h;
    keys.add(key);
    let cell=g.querySelector('.svw[data-k="'+key+'"]');
    if(!cell){ cell=document.createElement('div'); cell.className='svw svw-'+it.type+'-cell'; cell.dataset.k=key; g.appendChild(cell); }
    const p=place?place(it):{c:it.x,r:it.y};
    cell.style.gridColumn=(p.c+1)+' / span '+it.w; cell.style.gridRow=(p.r+1)+' / span '+it.h;
    cell.classList.toggle('big', it.w*it.h>=4);
    cell.dataset.sz=it.w+'x'+it.h;
    cell._it=it; cell._sd=sd;
    if(it.type==='clock'){ if(!cell.firstChild) cell.innerHTML=svClockHTML(it); return; }
    const html=svWidgetHTML(it, sd);
    if(cell._html!==html){
      cell.querySelectorAll('.svw-cam img').forEach(camStop);
      cell._html=html; cell.innerHTML=html; cell._live=null;
      if(it.type==='tile'||it.type==='room'||it.type==='cat'){ const n=cell.querySelector('.tile'), nt=((sd||{}).tiles||{})[it.uuid], pt=cell._tileIt;
        if(n) bindTile(n,nt);
        // Animierte Symbole: eingeschaltet -> Symbol ploppt; neuer Wert -> Statuszeile tickt
        if(n&&pt&&nt){ if(!pt.on&&nt.on) animOnce(n.querySelector('.head>:first-child'),'an-pop');
          else if(pt.sublabel&&nt.sublabel&&pt.sublabel!==nt.sublabel) animOnce(n.querySelector('.body .sub'),'an-val'); }
        cell._tileIt=nt; }
      if(it.type==='intercom' && camsOn) svStartCams(cell);
      if(it.type==='camera' && camsOn) camSwStart(cell);
      if(it.type==='status') stBind(cell);
    }
    if(it.type==='energy'||it.type==='chart'||it.type==='player') svPaintLive(cell,it,sd);
  });
  g.querySelectorAll('.svw').forEach(c=>{ if(!keys.has(c.dataset.k)){ c.querySelectorAll('.svw-cam img').forEach(camStop); c.remove(); } });
  tickSaverClocks();
}
// Kamerabilder nur bei sichtbarem Screensaver laufen lassen.
function svStartCams(root){
  const r=root||el('svGrid');
  (r.classList.contains('svw-intercom-cell') ? [r] : r.querySelectorAll('.svw-intercom-cell')).forEach(cell=>{
    const it=cell._it; if(!it) return;
    const ic=((cell._sd||saverData)&&(cell._sd||saverData).intercoms||{})[it.uuid];
    const video=ic&&(ic.blocks||[]).find(b=>b.k==='video'), img=cell.querySelector('.svw-cam img'),
      stat=cell.querySelector('.sv-cam-status');
    if(video&&img&&!img.getAttribute('src')) camStream(img, video.src, video.reconnectH||0,
      ()=>{ if(stat) stat.textContent='Kamera nicht erreichbar …'; }, ()=>{ if(stat) stat.textContent=''; });
  });
  (r.classList.contains('svw-camera-cell') ? [r] : r.querySelectorAll('.svw-camera-cell')).forEach(cell=>{
    const img=cell.querySelector('.svw-cam img'); if(img&&!img.getAttribute('src')) camSwStart(cell); });
}

// Einmal-Animation neu starten (Klasse ab, Reflow, wieder dran). Ob sie

function animOnce(e,cls){ if(!e) return; e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls);

// Ein MJPEG-<img> zeigt nach einem Stream-Ende einfach das letzte Bild weiter -
// ohne Fehler, ohne Neuaufbau ("eingefroren"). Enden kann der Stream z.B., wenn
// die Kamera/das WLAN kurz weg ist oder der Browser bei ausgeschaltetem Display
// nicht mehr mitliest (der Server gibt die Kamera dann nach 15 s frei). Deshalb:
//  - Ladefehler -> nach 8 s neuer Versuch

const CAM_RETRY_MS=8000;

// Dauerstrom wird im WebView Bild fuer Bild dekodiert und belegte dort ueber Tage

let LITE=false;

let CAM_CROP={};
function camCrop(img){
  const c=CAM_CROP[img.dataset.camid||'']||null, st=img.style;
  st.objectFit=c&&c.fit==='contain'?'contain':'';
  st.objectPosition=c?(c.x+'% '+c.y+'%'):'';
  st.transformOrigin=c?(c.x+'% '+c.y+'%'):'';
  st.transform=(c&&c.fit!=='contain'&&c.z>1)?'scale('+c.z+')':'';
  camFill(img, c&&c.fit==='contain' ? (c.bg==='blur'?'blur':'card') : '');

// verwischt dahinter. Fuer "verwischt" wird das laufende Kamerabild ~1x/s in
// ein 32x18-Canvas gezeichnet und weich hochskaliert - das wirkt wie Unschaerfe,
// kostet fast nichts und braucht keinen zweiten Stream.
function camFill(img, mode){
  const host=img.parentElement; if(!host) return;
  // Mehrere Kameras in einem Rahmen (Pillen): nur die gerade sichtbare bestimmt die Fuellung
  if(img.classList.contains('camimg')&&!img.classList.contains('on')&&host.querySelector(':scope>img.camimg.on')) return;
  host.classList.toggle('camfill-card', mode==='card');
  host.classList.toggle('camfill-blur', mode==='blur');
  let cv=host.querySelector(':scope>canvas.camblur');
  if(mode!=='blur'){ if(cv){ clearInterval(cv._t); cv.remove(); } return; }
  if(!cv){ cv=document.createElement('canvas'); cv.className='camblur'; cv.width=32; cv.height=18; host.insertBefore(cv, host.firstChild); }
  clearInterval(cv._t);
  const draw=()=>{ if(!cv.isConnected||!img.isConnected){ clearInterval(cv._t); return; }
    const src=host.querySelector(':scope>img.camimg.on')||img;
    if(document.hidden||!src.naturalWidth) return;
    try{ cv.getContext('2d').drawImage(src,0,0,32,18); }catch(e){ clearInterval(cv._t); } };

}

function camStream(img, src, reconnectH, onErr, onOk){

  const load=()=>{

    if(CAM_DARK) return;                       // Display aus: erst beim Aufwecken (camsDark) laden

// Zeichnet den Stunden-Temperaturverlauf als Inline-SVG (Regenband + Kurve),
// Vorschaukarten mit Regenwahrscheinlichkeit und die Termine als Tages-Agenda.
function fpCurve(hourly){
  const pts=hourly.filter(h=>h && h.temp!=null);
  if(pts.length<2) return '';
  const W=700,H=150,padT=24,padB=32,padX=12,n=pts.length;
  const temps=pts.map(p=>p.temp);
  let mn=Math.min(...temps), mx=Math.max(...temps);
  if(mx-mn<4){ const c=(mx+mn)/2; mn=c-2; mx=c+2; }
  const X=i=> padX + i*(W-2*padX)/(n-1);
  const Y=t=> padT + (mx-t)*(H-padT-padB)/(mx-mn);
  const barW=Math.max(3,(W-2*padX)/n*0.55);
  const bars=pts.map((p,i)=>{ if(p.pop==null||p.pop<=0) return '';
    const bh=(p.pop/100)*(H-padB-padT)*0.55;
    return '<rect x="'+(X(i)-barW/2).toFixed(1)+'" y="'+(H-padB-bh).toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="1.5" fill="#7fb2e6" opacity=".2"/>'; }).join('');
  const line=pts.map((p,i)=>X(i).toFixed(1)+','+Y(p.temp).toFixed(1)).join(' ');
  const area=X(0).toFixed(1)+','+(H-padB)+' '+line+' '+X(n-1).toFixed(1)+','+(H-padB);
  let lbl='';
  pts.forEach((p,i)=>{ if(i%3===0||i===n-1){
    lbl+='<text x="'+X(i).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" class="fpx">'+p.h+'</text>';
    lbl+='<text x="'+X(i).toFixed(1)+'" y="'+(Y(p.temp)-9).toFixed(1)+'" text-anchor="middle" class="fpt">'+p.temp+'°</text>'; }});
  return '<svg viewBox="0 0 '+W+' '+H+'">'+
    '<defs><linearGradient id="fpgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".22"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>'+
    bars+
    '<polygon points="'+area+'" fill="url(#fpgrad)"/>'+
    '<polyline points="'+line+'" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+X(0).toFixed(1)+'" cy="'+Y(pts[0].temp).toFixed(1)+'" r="4" fill="currentColor"/>'+
    lbl+'</svg>';
}

function energyInner(d){

      : '<text class="enlab" data-vl="'+i+'" x="'+tx+'" y="'+(ny+56).toFixed(1)+'">'+nm+'</text><text class="'+vcls+'" data-vv="'+i+'" x="'+tx+'" y="'+(ny+76).toFixed(1)+'">'+val+'</text>');

function fpMonthHTML(events, holidays, colors){
  const base=nowDate(); base.setDate(1); base.setMonth(base.getMonth()+calMonthOff);
  const y=base.getFullYear(), m=base.getMonth();
  const startDow=(new Date(y,m,1).getDay()+6)%7;    // 0 = Montag
  const dim=new Date(y,m+1,0).getDate();
  // Je Tag die Farben der Kalender sammeln, aus denen an ihm etwas ansteht —
  // jede Farbe nur einmal, damit fuenf Termine aus einem Abo nicht fuenf
  // gleiche Punkte ergeben.
  const evd=new Map();
  (events||[]).forEach(e=>{ if(!e||!e.date) return;
    const f=evd.get(e.date)||[]; if(e.color&&f.indexOf(e.color)<0) f.push(e.color);
    evd.set(e.date,f); });
  const hol=holidays||{}, todayISO=isoDay(nowDate());
  const pad=n=>String(n).padStart(2,'0');
  const mn=new Date(y,m,1).toLocaleDateString(LANG,{month:'long',year:'numeric'});
  let html='<div class="fp-mon"><div class="fp-mon-h">'+
    '<span class="fp-mnav" data-mnav="-1">‹</span>'+
    '<span class="fp-mtitle">'+esc(mn)+'</span>'+
    '<span class="fp-mnav" data-mnav="1">›</span></div><div class="fp-mon-g">';
  html+=['Mo','Di','Mi','Do','Fr','Sa','So'].map((d,i)=>'<div class="fp-mon-wd'+(i===6?' sun':'')+'">'+d+'</div>').join('');
  for(let i=0;i<startDow;i++) html+='<div class="fp-mon-c empty"></div>';
  for(let d=1;d<=dim;d++){
    const iso=y+'-'+pad(m+1)+'-'+pad(d);
    const dow=(startDow+d-1)%7;                     // 5=Sa, 6=So
    const isHol=!!hol[iso];
    const farben=(colors!==false ? (evd.get(iso)||[]) : []).slice(0,3);
    const cls='fp-mon-c'+(dow===5?' sat':'')+((dow===6||isHol)?' sun':'')+(isHol?' holi':'')+
      (iso===todayISO?' today':'')+(evd.has(iso)?' ev':'')+(farben.length?' dots':'')+
      (iso===calSel?' sel':'');
    const punkte=farben.length
      ? '<span class="mdots">'+farben.map(c=>'<i style="background:'+esc(c)+'"></i>').join('')+'</span>' : '';
    html+='<div class="'+cls+'" data-day="'+iso+'"'+(isHol?(' title="'+esc(hol[iso])+'"'):'')+'>'+d+punkte+'</div>';
  }
  return html+'</div></div>';
}

// Timer-basierte Sperre gegen "durchgereichte" Beruehrungen: manche Kiosk-

// Aufwecken-Tap noch ein Nachlauf-Event an die darunterliegende Kachel,

// das laesst sich nicht zuverlaessig ueber Event-Handling allein abfangen.
// Darum zusaetzlich eine kurze "Totzeit" direkt nach dem Ausblenden: jede
// Kachel-/Schalter-Interaktion in diesem Fenster wird ignoriert. 500ms sind

let _saverClosedAt = 0;

function hideSaver(){

// ---- Nachtmodus: Panel abdunkeln ----
// Tag/Nacht meldet der Server ({t:"night"}), Staerke und Aufhelldauer kommen je
// Panel im theme. Gedimmt wird ueber eine schwarze Auflage statt per CSS-Filter:

// position:fixed-Elementen, und die Auflage wirkt wie heruntergeregelte

const NIGHT = { on:false, dim:0, wake:20 };
let nightEl=null, nightWakeTimer=null;
function nightLayer(){
  if(!nightEl){
    nightEl=document.createElement('div'); nightEl.id='nightdim';
    nightEl.style.cssText='position:fixed;inset:0;background:#000;opacity:0;'+
      'pointer-events:none;z-index:100000;transition:opacity .8s ease';

  }
  return nightEl;
}
function applyNight(awake){
  nightLayer().style.opacity =
    (NIGHT.on && NIGHT.dim>0 && !awake) ? Math.min(90,NIGHT.dim)/100 : 0;
}
function setNight(on){ NIGHT.on=!!on; clearTimeout(nightWakeTimer); applyNight(false); }
function nightWake(){          // Beruehrung -> kurz voll aufhellen, dann zurueck
  if(!NIGHT.on || NIGHT.dim<=0 || NIGHT.wake<=0) return;
  clearTimeout(nightWakeTimer);
  applyNight(true);
  nightWakeTimer=setTimeout(()=>applyNight(false), NIGHT.wake*1000);
}
// ---- Display ohne Agent: Kiosk-App-Anbindung (Android) ----
// Auf einem Linux-Panel schaltet der Agent das Display (Server meldet agent:true,
// die Seite haelt sich dann raus). Ohne Agent uebernimmt die Seite: nach dpmsOff
// Sekunden Inaktivitaet Display aus ueber die JS-Schnittstelle der Kiosk-App,
// bei Klingel / Wecker / Notify / Goto wieder an. Erkannt wird Fully Kiosk
// Browser (window.fully; dort "Enable JavaScript Interface" einschalten).
// Neu laden gegen Einfrieren erledigt die Seite ohne Agent selbst (s. neuladenFaellig).
const DISP = { dpmsOff: 0, reloadHours: 0, reloadAt: null, agent: false, wake: false };
let dpmsTimer=null;
function kiosk(){
  const f=window.fully;
  return (f && typeof f.turnScreenOff==='function' && typeof f.turnScreenOn==='function') ? f : null;
}
function screenOff(){ const f=kiosk(); if(!f) return; _screenWasOff=true; camsDark(true); try{ f.turnScreenOff(); }catch(e){} }
function screenOn(){ camsDark(false); const f=kiosk(); if(!f) return; _screenWasOff=false;
  try{ if(typeof f.isScreenOn!=='function' || !f.isScreenOn()) f.turnScreenOn(); }catch(e){} }
// Wach-Sperre (Screen Wake Lock) fuer Tablets/iPad ohne Kiosk-App: das Geraet
// geht sonst nach der System-Sperrzeit schlafen. Gehalten, solange das Panel
// genutzt wird; nach der Leerlaufzeit (dpmsOff) losgelassen, damit das System
// den Schirm abschalten darf. Ohne Leerlaufzeit bleibt der Schirm an.
let _wake=null;
function wakeOn(){
  if(!DISP.wake || kiosk() || _wake || !navigator.wakeLock || document.visibilityState!=='visible') return;
  navigator.wakeLock.request('screen').then(l=>{ _wake=l; l.addEventListener('release',()=>{ if(_wake===l) _wake=null; }); }).catch(()=>{});
}
function wakeOff(){ const l=_wake; _wake=null; if(l) l.release().catch(()=>{}); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') armDpms(); });
function armDpms(){ clearTimeout(dpmsTimer);
  wakeOn(); camsDark(false);
  if(DISP.agent || !(DISP.dpmsOff>0)) return;
  // Mit Kiosk-JS (Fully) direkt abschalten; sonst dem Server Leerlauf melden,
  // der schaltet ueber den Display-Treiber des Geraets (Fully REST / WallPanel).
  dpmsTimer=setTimeout(()=>{ wakeOff(); camsDark(true); if(kiosk()) screenOff(); else send({t:'idle'}); }, DISP.dpmsOff*1000); }
function applyDisplayCfg(msg){
  DISP.dpmsOff = (typeof msg.dpmsOff==='number' && msg.dpmsOff>0) ? msg.dpmsOff : 0;
  // Neu laden: null = nicht eingestellt (nachts um reloadAt Uhr), sonst Stunden, 0 = aus
  DISP.reloadHours = (typeof msg.reloadHours==='number') ? Math.max(0, msg.reloadHours) : null;
  DISP.reloadAt = (typeof msg.reloadAt==='number') ? msg.reloadAt : null;
  DISP.agent = !!msg.agent;
  DISP.wake = !!msg.wake;
  armDpms();
}
// Neu laden gegen Einfrieren, nur ohne Agent (der startet den Browser selbst
// neu). reloadHours nicht eingestellt: einmal je Nacht, sobald es nach dem
// Laden der Seite reloadAt Uhr geworden ist; eine Zahl: so viele Stunden nach
// dem Laden; 0: nie. Geladen wird nur, waehrend das Dashboard (Uhr-Seite)
// steht, nie unter den Fingern; ein dunkles Display bleibt dunkel (aus LoxPanel #82).
const SEITE_GELADEN = Date.now();
function neuladenFaellig(jetzt){
  if(DISP.agent) return false;
  if(DISP.reloadHours===null){
    if(DISP.reloadAt===null) return false;
    const nacht=new Date(SEITE_GELADEN); nacht.setHours(DISP.reloadAt,0,0,0);
    if(nacht.getTime()<=SEITE_GELADEN) nacht.setDate(nacht.getDate()+1);
    return jetzt>=nacht.getTime();
  }
  return DISP.reloadHours>0 && jetzt-SEITE_GELADEN >= DISP.reloadHours*3600*1000;
}
setInterval(()=>{ if(saverOn() && neuladenFaellig(Date.now())) location.reload(); }, 60*1000);
// Server-Ereignis, das Aufmerksamkeit braucht: Display an, Uhr weg, Timer neu.
function wake(){ screenOn(); nightWake(); hideSaver(); resetIdle(); }
setInterval(tickClock, 1000);
showSaver();     // Startseite = Uhr
resetIdle();

connect();
</script>
