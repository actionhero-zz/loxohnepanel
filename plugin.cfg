[AUTHOR]
# Eigener Fork (Favoriten-Kachel) - bewusst ANDERS als das Original
# (Lenardo1/loxpanel), damit LoxBerry dies als eigenstaendiges Plugin fuehrt
# und es NICHT mit einer parallel installierten Originalversion kollidiert.
NAME=jan-fork
EMAIL=loxpanel-fork@localhost

[PLUGIN]
# Nach dem ersten Release NIEMALS mehr NAME/FOLDER/AUTHOR aendern – LoxBerry
# identifiziert das Plugin darueber (sonst schlagen Updates fehl).
VERSION=0.19.83
NAME=loxpanelfav
FOLDER=loxpanelfav
TITLE=LoxPanel Favoriten

[AUTOUPDATE]
# Auto-Update aus dem EIGENEN Fork-Repository (actionhero-zz/loxohnepanel, Hauptbranch). LoxBerry
# liest RELEASECFG, vergleicht dessen VERSION (SemVer) mit der installierten
# und laedt bei neuerer Version ARCHIVEURL. Update-Modus (aus / nur melden /
# automatisch) waehlt man in LoxBerry unter Plugin-Verwaltung.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/actionhero-zz/loxohnepanel/claude/festive-sagan-avv9if/release.cfg
PRERELEASECFG=

[SYSTEM]
# Kein Reboot noetig: Docker wird (falls es fehlt) synchron in preroot.sh
# selbst installiert und der Daemon startet per systemd sofort - unsere
# Skripte laufen ohnehin per sudo (kein docker-Gruppen-/Session-Neustart
# noetig). War vorher faelschlich "true" und loeste bei JEDEM Update einen
# Neustart-Hinweis aus, obwohl er nur beim allerersten Mal relevant waere.
REBOOT=false
# Interface V2 (aktuelles LoxBerry-Plugin-Format).
INTERFACE=2.0
# Mindestens LoxBerry 3.0 (Docker-Unterstuetzung / Debian Bullseye+).
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
# LoxPanel-Image ist multi-arch (siehe GitHub-Action baut linux/arm/v7): ARM64
# (Pi 4/5), x86_64, ARMv7 (Pi 2/3, 32-bit). LoxBerry prueft gegen `uname -m` ->
# 32-bit ist "armv7l" (NICHT "armhf", das ist der dpkg-Name und matcht nie).
# armhf bleibt drin, falls eine LoxBerry-Version doch den dpkg-Namen vergleicht.
# PUT in QUOTES.
ARCHITECTURE="aarch64,x86_64,armhf,armv7l"
CUSTOM_LOGLEVELS=true
